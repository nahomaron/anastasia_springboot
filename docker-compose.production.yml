services:
  postgres:
    profiles: ["local-db"]
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${DB_NAME:-anastasia}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    restart: always
    mem_limit: 1024m
    cpus: 1.00

  backend:
    image: ${BACKEND_IMAGE:?Missing BACKEND_IMAGE}
    env_file:
      - .env.production
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:?Missing DB_HOST}:${DB_PORT:-5432}/${DB_NAME:?Missing DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?Missing DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Missing DB_PASSWORD}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    restart: always
    pull_policy: always
    mem_limit: 1024m
    cpus: 1.50
