services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: anastasia-backend:local
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
  postgres:
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5432}:5432"
