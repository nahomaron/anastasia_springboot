name: Build Image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      git_sha:
        description: Commit SHA to build and publish
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  build-image:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          (
            github.event.workflow_run.head_branch == 'staging' ||
            github.event.workflow_run.head_branch == 'main'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/anastasia-backend
    outputs:
      git_sha: ${{ steps.release.outputs.git_sha }}
      image_ref: ${{ steps.release.outputs.image_ref }}
      built_at: ${{ steps.release.outputs.built_at }}
      build_run_id: ${{ steps.release.outputs.build_run_id }}
    steps:
      - name: Resolve build metadata
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "git_sha=${{ inputs.git_sha }}" >> "$GITHUB_OUTPUT"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          else
            echo "git_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "build_date=${{ github.event.workflow_run.updated_at }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify security gate succeeded
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.meta.outputs.git_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = process.env.TARGET_SHA;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            for (let attempt = 1; attempt <= 660; attempt += 1) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'security.yml',
                head_sha: headSha,
                per_page: 20,
              });

              const success = runs.data.workflow_runs.find((run) => run.conclusion === 'success');
              if (success) {
                return;
              }

              const pending = runs.data.workflow_runs.find((run) => ['queued', 'in_progress'].includes(run.status));
              if (!pending) {
                core.setFailed(`No successful security.yml run found for ${headSha}`);
                return;
              }

              await sleep(20000);
            }
            core.setFailed(`Timed out waiting for security.yml to succeed for ${headSha}`);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.git_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          tags: ${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.git_sha }}
          build-args: |
            VCS_REF=${{ steps.meta.outputs.git_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            REPO_URL=${{ github.server_url }}/${{ github.repository }}
      - name: Inspect pushed image
        run: docker buildx imagetools inspect "${IMAGE_REPO}@${{ steps.build.outputs.digest }}"
      - name: Create release manifest
        id: release
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          manifest = {
              "git_sha": os.environ["GIT_SHA"],
              "image_repo": os.environ["IMAGE_REPO"],
              "image_tag": os.environ["IMAGE_TAG"],
              "image_digest": os.environ["IMAGE_DIGEST"],
              "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
              "built_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("release-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"git_sha={manifest['git_sha']}\n")
              fh.write(f"image_ref={manifest['image_repo']}@{manifest['image_digest']}\n")
              fh.write(f"built_at={manifest['built_at']}\n")
              fh.write(f"build_run_id={manifest['workflow_run_id']}\n")
          PY
        env:
          GIT_SHA: ${{ steps.meta.outputs.git_sha }}
          IMAGE_REPO: ${{ env.IMAGE_REPO }}
          IMAGE_TAG: ${{ steps.meta.outputs.git_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
      - name: Upload deploy helper scripts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-scripts
          path: scripts/prune_backend_images.sh
      - name: Publish job summary
        run: |
          {
            echo "## Release Manifest"
            echo
            cat release-manifest.json
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    needs: build-image
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref_name == 'staging'
        ) ||
        (
          github.event_name != 'workflow_dispatch' &&
          github.event.workflow_run.head_branch == 'staging'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      REMOTE_ROOT: /opt/anastasis-staging
      COMPOSE_PROJECT_NAME: anastasis-staging
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-image.outputs.git_sha }}

      - name: Write staging environment file
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          test -n "$APP_ENV_FILE"
          printf '%s\n' "$APP_ENV_FILE" > .env.staging

      - name: Validate staging database target
        run: |
          DB_HOST_VALUE="$(grep '^DB_HOST=' .env.staging | cut -d= -f2- || true)"
          if [[ -z "${DB_HOST_VALUE}" ]]; then
            echo "DB_HOST is missing from staging APP_ENV_FILE" >&2
            exit 1
          fi
          case "${DB_HOST_VALUE}" in
            postgres|localhost|127.0.0.1)
              echo "Staging DB_HOST must point to RDS, not ${DB_HOST_VALUE}" >&2
              exit 1
              ;;
          esac

      - name: Configure SSH
        env:
          EXPECTED_HOST_KEY_FINGERPRINT: ${{ secrets.DEPLOY_HOST_KEY_FINGERPRINT }}
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -n "${EXPECTED_HOST_KEY_FINGERPRINT}"
          HOST_KEY="$(ssh-keyscan -p "${DEPLOY_PORT}" -t ed25519 "${{ secrets.DEPLOY_HOST }}" 2>/dev/null)"
          test -n "${HOST_KEY}"
          SCANNED_FINGERPRINT="$(printf '%s\n' "${HOST_KEY}" | ssh-keygen -lf - | awk 'NR==1 {print $2}')"
          [[ "${SCANNED_FINGERPRINT}" == "${EXPECTED_HOST_KEY_FINGERPRINT}" ]]
          printf '%s\n' "${HOST_KEY}" >> ~/.ssh/known_hosts
          ssh -p "${DEPLOY_PORT}" -o BatchMode=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p '${REMOTE_ROOT}'"

      - name: Upload compose bundle
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          scp -P "${DEPLOY_PORT}" compose.yaml docker-compose.staging.yml .env.staging scripts/prune_backend_images.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${REMOTE_ROOT}/"

      - name: Deploy exact image digest to staging
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -p "${DEPLOY_PORT}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "REMOTE_ROOT='${REMOTE_ROOT}' COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' IMAGE_REF='${{ needs.build-image.outputs.image_ref }}' GIT_SHA='${{ needs.build-image.outputs.git_sha }}' BUILT_AT='${{ needs.build-image.outputs.built_at }}' bash -s" <<'EOF'
          set -euo pipefail
          mkdir -p "${REMOTE_ROOT}/releases" "${REMOTE_ROOT}/diagnostics"
          cd "${REMOTE_ROOT}"

          if [ -f releases/current.env ]; then
            cp releases/current.env releases/previous.env
          fi

          printf '%s\n' \
            "BACKEND_IMAGE=${IMAGE_REF}" \
            "GIT_SHA=${GIT_SHA}" \
            "DEPLOYED_AT=${BUILT_AT}" > releases/current.env

          docker pull "${IMAGE_REF}"
          docker compose -p "${COMPOSE_PROJECT_NAME}" --env-file releases/current.env --env-file .env.staging \
            -f compose.yaml -f docker-compose.staging.yml rm -sf postgres || true
          docker compose -p "${COMPOSE_PROJECT_NAME}" --env-file releases/current.env --env-file .env.staging \
            -f compose.yaml -f docker-compose.staging.yml up -d --no-deps backend
          EOF

      - name: Publish staging summary
        run: |
          {
            echo "## Staging Deployment"
            echo
            echo "- Build run: ${{ needs.build-image.outputs.build_run_id }}"
            echo "- Git SHA: ${{ needs.build-image.outputs.git_sha }}"
            echo "- Image: \`${{ needs.build-image.outputs.image_ref }}\`"
            echo "- URL: ${{ vars.APP_BACKEND_BASE_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run staging smoke checks
        env:
          BASE_URL: ${{ vars.APP_BACKEND_BASE_URL }}
          SMOKE_EMAIL_SECRET: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_EMAIL_VAR: ${{ vars.SMOKE_EMAIL }}
          SMOKE_PASSWORD_SECRET: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_PASSWORD_VAR: ${{ vars.SMOKE_PASSWORD }}
          SMOKE_TENANT_PATH_SECRET: ${{ secrets.SMOKE_TENANT_PATH }}
          SMOKE_TENANT_PATH_VAR: ${{ vars.SMOKE_TENANT_PATH }}
          SMOKE_TENANT_ID_SECRET: ${{ secrets.SMOKE_TENANT_ID }}
          SMOKE_TENANT_ID_VAR: ${{ vars.SMOKE_TENANT_ID }}
        run: |
          mkdir -p diagnostics
          HEALTH_BODY="diagnostics/staging-health.json"
          LOGIN_BODY="diagnostics/staging-login.json"
          PROFILE_BODY="diagnostics/staging-profile.json"
          PROFILE_HEADERS="diagnostics/staging-profile.headers"
          TENANT_BODY="diagnostics/staging-tenant.json"
          TENANT_HEADERS="diagnostics/staging-tenant.headers"
          DEFAULT_TENANT_PATH="/api/v1/tenant/current/verification-status"

          print_body_preview() {
            local file_path="$1"
            if [[ -s "${file_path}" ]]; then
              echo "--- ${file_path} ---" >&2
              sed -n '1,120p' "${file_path}" >&2 || true
              echo >&2
            fi
          }

          capture_remote_smoke_diagnostics() {
            local access_token="$1"
            local tenant_path="$2"
            local tenant_id="$3"
            local deploy_port="${DEPLOY_PORT:-22}"

            ssh -p "${deploy_port}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "REMOTE_ROOT='${REMOTE_ROOT}' COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' ACCESS_TOKEN='${access_token}' TENANT_PATH='${tenant_path}' TENANT_ID='${tenant_id}' bash -s" <<'EOF' || true
            set -euo pipefail
            cd "${REMOTE_ROOT}"
            mkdir -p diagnostics

            docker compose -p "${COMPOSE_PROJECT_NAME}" --env-file releases/current.env --env-file .env.staging \
              -f compose.yaml -f docker-compose.staging.yml ps > diagnostics/smoke-compose-ps.txt || true
            docker compose -p "${COMPOSE_PROJECT_NAME}" --env-file releases/current.env --env-file .env.staging \
              -f compose.yaml -f docker-compose.staging.yml logs --tail=200 backend > diagnostics/smoke-backend.log || true

            curl -sS -D diagnostics/smoke-local-health.headers -o diagnostics/smoke-local-health.json -w "%{http_code}" \
              http://localhost:8081/actuator/health > diagnostics/smoke-local-health.status || true

            if [[ -n "${ACCESS_TOKEN}" ]]; then
              curl -sS -D diagnostics/smoke-local-profile.headers -o diagnostics/smoke-local-profile.json -w "%{http_code}" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                http://localhost:8081/api/v1/users/me/profile > diagnostics/smoke-local-profile.status || true

              curl -sS -D diagnostics/smoke-local-tenant.headers -o diagnostics/smoke-local-tenant.json -w "%{http_code}" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                "http://localhost:8081${TENANT_PATH}" > diagnostics/smoke-local-tenant.status || true

              if [[ "$(cat diagnostics/smoke-local-tenant.status 2>/dev/null || true)" != "200" && -n "${TENANT_ID}" ]]; then
                curl -sS -D diagnostics/smoke-local-tenant.headers -o diagnostics/smoke-local-tenant.json -w "%{http_code}" \
                  -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                  -H "X-Tenant-ID: ${TENANT_ID}" \
                  "http://localhost:8081${TENANT_PATH}" > diagnostics/smoke-local-tenant.status || true
              fi
            fi

            grep -E -i "flyway|migration|sqlstate|caused by:|exception|relation .* does not exist|user_profiles|user_two_factor_backup_codes" \
              diagnostics/smoke-backend.log | tail -n 120 > diagnostics/smoke-backend-hints.txt || true
            EOF
          }

          BASE_URL="$(printf '%s' "${BASE_URL}" | tr -d '\r')"
          case "${BASE_URL}" in
            http://*|https://*) ;;
            *)
              echo "BASE_URL must start with http:// or https://, got '${BASE_URL}'" >&2
              exit 1
              ;;
          esac

          SMOKE_EMAIL="${SMOKE_EMAIL_SECRET:-${SMOKE_EMAIL_VAR:-}}"
          SMOKE_PASSWORD="${SMOKE_PASSWORD_SECRET:-${SMOKE_PASSWORD_VAR:-}}"
          SMOKE_TENANT_PATH_RAW="${SMOKE_TENANT_PATH_SECRET:-${SMOKE_TENANT_PATH_VAR:-}}"
          SMOKE_TENANT_ID="${SMOKE_TENANT_ID_SECRET:-${SMOKE_TENANT_ID_VAR:-}}"

          for required in SMOKE_EMAIL SMOKE_PASSWORD; do
            if [[ -z "${!required}" ]]; then
              echo "Missing required staging smoke configuration: ${required}" >&2
              exit 1
            fi
          done

          SMOKE_TENANT_PATH_RAW="$(printf '%s' "${SMOKE_TENANT_PATH_RAW}" | tr -d '\r')"
          if [[ -z "${SMOKE_TENANT_PATH_RAW}" ]]; then
            SMOKE_TENANT_PATH="${DEFAULT_TENANT_PATH}"
          elif [[ "${SMOKE_TENANT_PATH_RAW}" == /* ]]; then
            SMOKE_TENANT_PATH="${SMOKE_TENANT_PATH_RAW}"
          elif [[ "${SMOKE_TENANT_PATH_RAW}" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "SMOKE_TENANT_PATH uses legacy slug-style value '${SMOKE_TENANT_PATH_RAW}'; falling back to ${DEFAULT_TENANT_PATH}" >&2
            SMOKE_TENANT_PATH="${DEFAULT_TENANT_PATH}"
          else
            echo "SMOKE_TENANT_PATH must start with '/' or be a legacy slug value, got '${SMOKE_TENANT_PATH_RAW}'" >&2
            exit 1
          fi

          for attempt in {1..18}; do
            HEALTH_STATUS=$(curl -sS -o "${HEALTH_BODY}" -w "%{http_code}" \
              "${BASE_URL}/actuator/health" || true)
            if [[ "${HEALTH_STATUS}" == "200" ]]; then
              break
            fi
            if [[ "${attempt}" == "18" ]]; then
              echo "Staging health check did not become ready; last status=${HEALTH_STATUS}" >&2
              print_body_preview "${HEALTH_BODY}"
              exit 1
            fi
            sleep 10
          done

          LOGIN_STATUS=$(curl -sS -o "${LOGIN_BODY}" -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${SMOKE_EMAIL}\",\"password\":\"${SMOKE_PASSWORD}\"}" \
            "${BASE_URL}/api/v1/auth/login")
          if [[ "${LOGIN_STATUS}" != "200" ]]; then
            echo "Staging login failed; status=${LOGIN_STATUS}" >&2
            print_body_preview "${LOGIN_BODY}"
            exit 1
          fi

          ACCESS_TOKEN=$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("diagnostics/staging-login.json").read_text())
          print(data.get("accessToken", ""))
          PY
          )
          if [[ -z "${ACCESS_TOKEN}" ]]; then
            echo "Staging login response did not contain accessToken" >&2
            print_body_preview "${LOGIN_BODY}"
            exit 1
          fi

          PROFILE_STATUS=$(curl -sS -D "${PROFILE_HEADERS}" -o "${PROFILE_BODY}" -w "%{http_code}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${BASE_URL}/api/v1/users/me/profile")
          if [[ "${PROFILE_STATUS}" != "200" ]]; then
            echo "Staging profile check failed; status=${PROFILE_STATUS}" >&2
            capture_remote_smoke_diagnostics "${ACCESS_TOKEN}" "${SMOKE_TENANT_PATH}" "${SMOKE_TENANT_ID}"
            print_body_preview "${PROFILE_BODY}"
            exit 1
          fi

          TENANT_STATUS=$(curl -sS -D "${TENANT_HEADERS}" -o "${TENANT_BODY}" -w "%{http_code}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${BASE_URL}${SMOKE_TENANT_PATH}")
          if [[ "${TENANT_STATUS}" != "200" && -n "${SMOKE_TENANT_ID}" ]]; then
            TENANT_STATUS=$(curl -sS -D "${TENANT_HEADERS}" -o "${TENANT_BODY}" -w "%{http_code}" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "X-Tenant-ID: ${SMOKE_TENANT_ID}" \
              "${BASE_URL}${SMOKE_TENANT_PATH}")
          fi
          if [[ "${TENANT_STATUS}" != "200" ]]; then
            echo "Staging tenant check failed; status=${TENANT_STATUS}; path=${SMOKE_TENANT_PATH}" >&2
            capture_remote_smoke_diagnostics "${ACCESS_TOKEN}" "${SMOKE_TENANT_PATH}" "${SMOKE_TENANT_ID}"
            print_body_preview "${TENANT_BODY}"
            exit 1
          fi

      - name: Prune stale backend images on staging host
        if: success()
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/anastasia-backend
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -p "${DEPLOY_PORT}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "chmod +x '${REMOTE_ROOT}/prune_backend_images.sh' && '${REMOTE_ROOT}/prune_backend_images.sh' '${IMAGE_REPO}'"

      - name: Capture staging disk diagnostics
        if: always()
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          mkdir -p diagnostics
          ssh -p "${DEPLOY_PORT}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "df -h / && echo && docker system df" > diagnostics/staging-disk-usage.txt || true

      - name: Disable EC2 staging postgres container
        if: success()
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -p "${DEPLOY_PORT}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${REMOTE_ROOT}' && docker compose -p '${COMPOSE_PROJECT_NAME}' --env-file releases/current.env --env-file .env.staging -f compose.yaml -f docker-compose.staging.yml rm -sf postgres || true"

      - name: Capture remote diagnostics before rollback
        if: failure()
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          mkdir -p diagnostics/remote
          ssh -p "${DEPLOY_PORT}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "REMOTE_ROOT='${REMOTE_ROOT}' COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${REMOTE_ROOT}"
          docker compose -p "${COMPOSE_PROJECT_NAME}" --env-file releases/current.env --env-file .env.staging \
            -f compose.yaml -f docker-compose.staging.yml ps > diagnostics/compose-ps.txt || true
          docker compose -p "${COMPOSE_PROJECT_NAME}" --env-file releases/current.env --env-file .env.staging \
            -f compose.yaml -f docker-compose.staging.yml logs --tail=200 backend > diagnostics/backend.log || true
          curl -sS http://localhost:8081/actuator/health > diagnostics/health.json || true
          EOF
          scp -P "${DEPLOY_PORT}" -r "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${REMOTE_ROOT}/diagnostics/." diagnostics/remote/ || true

      - name: Roll back staging to previous release
        if: failure()
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -p "${DEPLOY_PORT}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "REMOTE_ROOT='${REMOTE_ROOT}' COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${REMOTE_ROOT}"
          test -f releases/previous.env
          cp releases/previous.env releases/current.env
          docker compose -p "${COMPOSE_PROJECT_NAME}" --env-file releases/current.env --env-file .env.staging \
            -f compose.yaml -f docker-compose.staging.yml rm -sf postgres || true
          docker compose -p "${COMPOSE_PROJECT_NAME}" --env-file releases/current.env --env-file .env.staging \
            -f compose.yaml -f docker-compose.staging.yml up -d --no-deps backend
          EOF

      - name: Upload staging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-staging-diagnostics-${{ needs.build-image.outputs.git_sha }}
          path: diagnostics
          if-no-files-found: ignore

      - name: Upload staging release metadata
        if: success()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          Path("staging-release.json").write_text(json.dumps({
              "git_sha": "${{ needs.build-image.outputs.git_sha }}",
              "build_run_id": "${{ needs.build-image.outputs.build_run_id }}",
              "staging_url": "${{ vars.APP_BACKEND_BASE_URL }}",
              "image_ref": "${{ needs.build-image.outputs.image_ref }}",
              "built_at": "${{ needs.build-image.outputs.built_at }}",
          }, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload staging release artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: staging-release
          path: staging-release.json
