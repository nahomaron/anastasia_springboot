name: Promote Production

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Build Image workflow run id that produced release-manifest.json
        required: true
        type: string
      release_version:
        description: Optional release label or tag for the deployment summary
        required: false
        type: string

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  promote-production:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    concurrency:
      group: promote-production
      cancel-in-progress: false
    env:
      REMOTE_ROOT: /opt/anastasis-production
      COMPOSE_PROJECT_NAME: anastasis-production
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: artifacts/release-manifest
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse manifest
        id: manifest
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("artifacts/release-manifest/release-manifest.json").read_text())
          image_ref = f"{manifest['image_repo']}@{manifest['image_digest']}"
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as fh:
              fh.write(f"git_sha={manifest['git_sha']}\n")
              fh.write(f"image_ref={image_ref}\n")
              fh.write(f"built_at={manifest['built_at']}\n")
          PY

      - name: Verify staging and k6 gates
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.manifest.outputs.git_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.TARGET_SHA;
            const workflows = ['deploy-staging.yml', 'k6-load.yml'];

            for (const workflowId of workflows) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                head_sha: sha,
                per_page: 20,
              });

              const success = runs.data.workflow_runs.find((run) => run.conclusion === 'success');
              if (!success) {
                core.setFailed(`Required gate ${workflowId} has not succeeded for ${sha}`);
                return;
              }
            }

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate published image digest
        run: docker buildx imagetools inspect "${{ steps.manifest.outputs.image_ref }}"

      - name: Write production environment file
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          test -n "$APP_ENV_FILE"
          printf '%s\n' "$APP_ENV_FILE" > .env.production

      - name: Validate production database target
        run: |
          DB_HOST_VALUE="$(grep '^DB_HOST=' .env.production | cut -d= -f2- || true)"
          if [[ -z "${DB_HOST_VALUE}" ]]; then
            echo "DB_HOST is missing from production APP_ENV_FILE" >&2
            exit 1
          fi
          case "${DB_HOST_VALUE}" in
            postgres|localhost|127.0.0.1)
              echo "Production DB_HOST must point to RDS, not ${DB_HOST_VALUE}" >&2
              exit 1
              ;;
          esac

      - name: Configure SSH
        env:
          EXPECTED_HOST_KEY_FINGERPRINT: ${{ secrets.DEPLOY_HOST_KEY_FINGERPRINT }}
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -n "${EXPECTED_HOST_KEY_FINGERPRINT}"
          HOST_KEY="$(ssh-keyscan -p "${DEPLOY_PORT}" -t ed25519 "${{ secrets.DEPLOY_HOST }}" 2>/dev/null)"
          test -n "${HOST_KEY}"
          SCANNED_FINGERPRINT="$(printf '%s\n' "${HOST_KEY}" | ssh-keygen -lf - | awk 'NR==1 {print $2}')"
          [[ "${SCANNED_FINGERPRINT}" == "${EXPECTED_HOST_KEY_FINGERPRINT}" ]]
          printf '%s\n' "${HOST_KEY}" >> ~/.ssh/known_hosts
          ssh -p "${DEPLOY_PORT}" -o BatchMode=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p '${REMOTE_ROOT}'"

      - name: Upload compose bundle
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          scp -P "${DEPLOY_PORT}" compose.yaml docker-compose.production.yml .env.production scripts/prune_backend_images.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${REMOTE_ROOT}/"

      - name: Promote exact image digest to production
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -p "${DEPLOY_PORT}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "REMOTE_ROOT='${REMOTE_ROOT}' COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' IMAGE_REF='${{ steps.manifest.outputs.image_ref }}' GIT_SHA='${{ steps.manifest.outputs.git_sha }}' BUILT_AT='${{ steps.manifest.outputs.built_at }}' bash -s" <<'EOF'
          set -euo pipefail
          mkdir -p "${REMOTE_ROOT}/releases" "${REMOTE_ROOT}/diagnostics"
          cd "${REMOTE_ROOT}"

          if [ -f releases/current.env ]; then
            cp releases/current.env releases/previous.env
          fi

          printf '%s\n' \
            "BACKEND_IMAGE=${IMAGE_REF}" \
            "GIT_SHA=${GIT_SHA}" \
            "DEPLOYED_AT=${BUILT_AT}" > releases/current.env

          docker pull "${IMAGE_REF}"
          docker compose -p "${COMPOSE_PROJECT_NAME}" --env-file releases/current.env --env-file .env.production \
            -f compose.yaml -f docker-compose.production.yml rm -sf postgres || true
          docker compose -p "${COMPOSE_PROJECT_NAME}" --env-file releases/current.env --env-file .env.production \
            -f compose.yaml -f docker-compose.production.yml up -d --no-deps backend
          EOF

      - name: Run production smoke checks
        env:
          BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_TENANT_PATH: ${{ secrets.SMOKE_TENANT_PATH }}
          SMOKE_TENANT_ID: ${{ secrets.SMOKE_TENANT_ID }}
        run: |
          mkdir -p diagnostics
          curl -fsS "${BASE_URL}/actuator/health" -o diagnostics/production-health.json

          for required in SMOKE_EMAIL SMOKE_PASSWORD SMOKE_TENANT_PATH; do
            if [[ -z "${!required}" ]]; then
              echo "Missing required production smoke secret: ${required}" >&2
              exit 1
            fi
          done

          LOGIN_STATUS=$(curl -sS -o diagnostics/production-login.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${SMOKE_EMAIL}\",\"password\":\"${SMOKE_PASSWORD}\"}" \
            "${BASE_URL}/api/v1/auth/login")
          [[ "${LOGIN_STATUS}" == "200" ]]

          ACCESS_TOKEN=$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("diagnostics/production-login.json").read_text())
          print(data.get("accessToken", ""))
          PY
          )
          [[ -n "${ACCESS_TOKEN}" ]]

          PROFILE_STATUS=$(curl -sS -o diagnostics/production-profile.json -w "%{http_code}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${BASE_URL}/api/v1/users/me/profile")
          [[ "${PROFILE_STATUS}" == "200" ]]

          TENANT_HEADERS=(-H "Authorization: Bearer ${ACCESS_TOKEN}")
          if [[ -n "${SMOKE_TENANT_ID}" ]]; then
            TENANT_HEADERS+=(-H "X-Tenant-ID: ${SMOKE_TENANT_ID}")
          fi
          TENANT_STATUS=$(curl -sS -o diagnostics/production-tenant.json -w "%{http_code}" \
            "${TENANT_HEADERS[@]}" \
            "${BASE_URL}${SMOKE_TENANT_PATH}")
          [[ "${TENANT_STATUS}" == "200" ]]

      - name: Prune stale backend images on remote host
        if: success()
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/anastasia-backend
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -p "${DEPLOY_PORT}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "chmod +x '${REMOTE_ROOT}/prune_backend_images.sh' && '${REMOTE_ROOT}/prune_backend_images.sh' '${IMAGE_REPO}'"

      - name: Capture production disk diagnostics
        if: always()
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          mkdir -p diagnostics
          ssh -p "${DEPLOY_PORT}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "df -h / && echo && docker system df" > diagnostics/production-disk-usage.txt || true

      - name: Disable EC2 production postgres container
        if: success()
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -p "${DEPLOY_PORT}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${REMOTE_ROOT}' && docker compose -p '${COMPOSE_PROJECT_NAME}' --env-file releases/current.env --env-file .env.production -f compose.yaml -f docker-compose.production.yml rm -sf postgres || true"

      - name: Capture remote diagnostics before rollback
        if: failure()
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          mkdir -p diagnostics/remote
          ssh -p "${DEPLOY_PORT}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "REMOTE_ROOT='${REMOTE_ROOT}' COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${REMOTE_ROOT}"
          docker compose -p "${COMPOSE_PROJECT_NAME}" --env-file releases/current.env --env-file .env.production \
            -f compose.yaml -f docker-compose.production.yml ps > diagnostics/compose-ps.txt || true
          docker compose -p "${COMPOSE_PROJECT_NAME}" --env-file releases/current.env --env-file .env.production \
            -f compose.yaml -f docker-compose.production.yml logs --tail=200 backend > diagnostics/backend.log || true
          curl -sS http://localhost:8080/actuator/health > diagnostics/health.json || true
          EOF
          scp -P "${DEPLOY_PORT}" -r "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${REMOTE_ROOT}/diagnostics/." diagnostics/remote/ || true

      - name: Roll back production to previous release
        if: failure()
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -p "${DEPLOY_PORT}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "REMOTE_ROOT='${REMOTE_ROOT}' COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${REMOTE_ROOT}"
          test -f releases/previous.env
          cp releases/previous.env releases/current.env
          docker compose -p "${COMPOSE_PROJECT_NAME}" --env-file releases/current.env --env-file .env.production \
            -f compose.yaml -f docker-compose.production.yml rm -sf postgres || true
          docker compose -p "${COMPOSE_PROJECT_NAME}" --env-file releases/current.env --env-file .env.production \
            -f compose.yaml -f docker-compose.production.yml up -d --no-deps backend
          EOF

      - name: Upload production diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promote-production-diagnostics-${{ steps.manifest.outputs.git_sha }}
          path: diagnostics
          if-no-files-found: ignore

      - name: Publish production summary
        run: |
          {
            echo "## Production Promotion"
            echo
            echo "- Release: ${{ inputs.release_version || 'manual' }}"
            echo "- Build run: ${{ inputs.build_run_id }}"
            echo "- Git SHA: ${{ steps.manifest.outputs.git_sha }}"
            echo "- Image: \`${{ steps.manifest.outputs.image_ref }}\`"
            echo "- URL: ${{ secrets.PUBLIC_BASE_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"
