name: Security

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Image"]
    types: [completed]

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  gitleaks:
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        id: gitleaks
        uses: gacts/gitleaks@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gitleaks-report
          path: ${{ steps.gitleaks.outputs.sarif }}
          if-no-files-found: ignore

  container-security:
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    steps:
      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: artifacts/release-manifest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Parse manifest
        id: manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("artifacts/release-manifest/release-manifest.json").read_text())
          with open(Path(__import__("os").environ["GITHUB_OUTPUT"]), "a", encoding="utf-8") as fh:
              fh.write(f"image_ref={manifest['image_repo']}@{manifest['image_digest']}\n")
              fh.write(f"git_sha={manifest['git_sha']}\n")
          PY
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.manifest.outputs.image_ref }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.manifest.outputs.image_ref }}
          output-file: sbom.spdx.json
          format: spdx-json
      - name: Upload container security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-container-scan-${{ steps.manifest.outputs.git_sha }}
          path: |
            trivy-results.sarif
            sbom.spdx.json
          if-no-files-found: ignore

  security:
    name: Security Gate
    if: ${{ github.event_name != 'workflow_run' && always() }}
    runs-on: ubuntu-latest
    needs:
      - gitleaks
    steps:
      - name: Evaluate security result
        run: |
          if [[ "${{ needs.gitleaks.result }}" != "success" ]]; then
            exit 1
          fi
