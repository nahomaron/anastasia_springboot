name: Security

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Image"]
    types: [completed]

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  dependency-check:
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      DC_DATA_DIR: ${{ github.workspace }}/.cache/dependency-check-data
      DC_SUPPRESSION_FILE: .github/dependency-check-suppressions.xml
      DC_VERSION: 12.2.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Prepare Dependency-Check data directory
        run: mkdir -p "${DC_DATA_DIR}"
      - name: Restore Dependency-Check data
        id: dependency-check-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DC_DATA_DIR }}
          key: ${{ runner.os }}-dependency-check-v5-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-v5-${{ github.ref_name }}-
            ${{ runner.os }}-dependency-check-v5-
      - name: Grant Maven wrapper permission
        run: chmod +x ./mvnw
      - name: Run OWASP Dependency-Check
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/dependency-check-reports

          run_dc() {
            ./mvnw --batch-mode -DskipTests \
              org.owasp:dependency-check-maven:${DC_VERSION}:check \
              -DnvdApiKey="${NVD_API_KEY}" \
              -DdataDirectory="${DC_DATA_DIR}" \
              -DsuppressionFiles="${DC_SUPPRESSION_FILE}" \
              -Dformat=ALL \
              -DoutputDirectory=target/dependency-check-reports \
              -DfailBuildOnCVSS=7 \
              "$@"
          }

          has_usable_dc_database() {
            find "${DC_DATA_DIR}" -type f \
              \( -name '*.mv.db' -o -name '*.h2.db' -o -name '*.script' \) \
              -print -quit 2>/dev/null | grep -q .
          }

          fallback_to_cached_data() {
            echo "Dependency-Check retrying with cached data and autoupdate disabled."
            run_dc -Dautoupdate=false 2>&1 | tee target/dependency-check-fallback.log
          }

          reset_dc_cache() {
            echo "Dependency-Check cache appears corrupted; clearing ${DC_DATA_DIR}."
            rm -rf "${DC_DATA_DIR}"
            mkdir -p "${DC_DATA_DIR}"
          }

          cache_corruption_detected() {
            local log_file="${1:-target/dependency-check.log}"
            grep -Eq \
              'MVStoreException|ClosedChannelException|Data source is closed|NoDataException: No documents exist|connectionPool" is null' \
              "${log_file}"
          }

          nvd_transient_failure_detected() {
            grep -Eq \
              'NVD Returned Status Code: (429|502|503|504)|NVD API request failures are occurring' \
              target/dependency-check.log
          }

          max_attempts=3
          attempt=1
          cache_reset_attempted=0
          usable_cache_available=0
          if has_usable_dc_database; then
            usable_cache_available=1
          fi
          while true; do
            run_dc 2>&1 | tee target/dependency-check.log
            status=${PIPESTATUS[0]}
            [[ ${status} -eq 0 ]] && break

            if grep -q 'Value too long for column "URL CHARACTER VARYING(1000)"' target/dependency-check.log; then
              fallback_to_cached_data
              fallback_status=${PIPESTATUS[0]}
              if (( fallback_status != 0 )) && cache_corruption_detected target/dependency-check-fallback.log && (( cache_reset_attempted == 0 )); then
                cache_reset_attempted=1
                usable_cache_available=0
                reset_dc_cache
                attempt=1
                continue
              fi
              exit ${fallback_status}
            fi

            if nvd_transient_failure_detected; then
              if (( usable_cache_available == 1 )) || has_usable_dc_database; then
                fallback_to_cached_data
                fallback_status=${PIPESTATUS[0]}
                if (( fallback_status != 0 )) && cache_corruption_detected target/dependency-check-fallback.log && (( cache_reset_attempted == 0 )); then
                  cache_reset_attempted=1
                  usable_cache_available=0
                  reset_dc_cache
                  attempt=1
                  continue
                fi
                exit ${fallback_status}
              fi

              if (( attempt < max_attempts )); then
                sleep_seconds=$(( attempt * 30 ))
                echo "Dependency-Check hit transient NVD/API failures without a usable local database, retrying in ${sleep_seconds}s (attempt ${attempt}/${max_attempts})."
                sleep "${sleep_seconds}"
                attempt=$(( attempt + 1 ))
                continue
              fi
            fi

            if cache_corruption_detected; then
              if (( cache_reset_attempted == 0 )); then
                cache_reset_attempted=1
                usable_cache_available=0
                reset_dc_cache
                attempt=1
                continue
              fi
            fi

            exit ${status}
          done
      - name: Upload dependency check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-dependency-check-reports
          path: |
            target/dependency-check-reports
            target/dependency-check.log
            target/dependency-check-fallback.log
          if-no-files-found: ignore
      - name: Check Dependency-Check cache health
        if: always()
        id: dependency-check-cache-health
        shell: bash
        run: |
          if find "${DC_DATA_DIR}" -type f \
            \( -name '*.mv.db' -o -name '*.h2.db' -o -name '*.script' \) \
            -print -quit 2>/dev/null | grep -q .; then
            echo "has-db=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has-db=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Save Dependency-Check data
        if: success() && steps.dependency-check-cache-health.outputs.has-db == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DC_DATA_DIR }}
          key: ${{ steps.dependency-check-cache-restore.outputs.cache-primary-key }}

  gitleaks:
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        id: gitleaks
        uses: gacts/gitleaks@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gitleaks-report
          path: ${{ steps.gitleaks.outputs.sarif }}
          if-no-files-found: ignore

  container-security:
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    steps:
      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: artifacts/release-manifest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Parse manifest
        id: manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("artifacts/release-manifest/release-manifest.json").read_text())
          with open(Path(__import__("os").environ["GITHUB_OUTPUT"]), "a", encoding="utf-8") as fh:
              fh.write(f"image_ref={manifest['image_repo']}@{manifest['image_digest']}\n")
              fh.write(f"git_sha={manifest['git_sha']}\n")
          PY
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.manifest.outputs.image_ref }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.manifest.outputs.image_ref }}
          output-file: sbom.spdx.json
          format: spdx-json
      - name: Upload container security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-container-scan-${{ steps.manifest.outputs.git_sha }}
          path: |
            trivy-results.sarif
            sbom.spdx.json
          if-no-files-found: ignore

  security:
    name: Security Gate
    if: ${{ github.event_name != 'workflow_run' && always() }}
    runs-on: ubuntu-latest
    needs:
      - dependency-check
      - gitleaks
    steps:
      - name: Evaluate security result
        run: |
          if [[ "${{ needs.dependency-check.result }}" != "success" ]] || \
             [[ "${{ needs.gitleaks.result }}" != "success" ]]; then
            exit 1
          fi
