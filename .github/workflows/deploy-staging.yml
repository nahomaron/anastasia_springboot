name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Build Image workflow run id that produced release-manifest.json
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      REMOTE_ROOT: /opt/anastasis-staging
      COMPOSE_PROJECT_NAME: anastasis-staging
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build run id
        id: run
        run: |
          echo "build_run_id=${{ inputs.build_run_id }}" >> "$GITHUB_OUTPUT"

      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: artifacts/release-manifest
          run-id: ${{ steps.run.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse manifest
        id: manifest
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("artifacts/release-manifest/release-manifest.json").read_text())
          image_ref = f"{manifest['image_repo']}@{manifest['image_digest']}"
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as fh:
              fh.write(f"git_sha={manifest['git_sha']}\n")
              fh.write(f"image_ref={image_ref}\n")
              fh.write(f"built_at={manifest['built_at']}\n")
          Path("staging-release.json").write_text(json.dumps({
              "git_sha": manifest["git_sha"],
              "build_run_id": os.environ["BUILD_RUN_ID"],
              "staging_url": os.environ["APP_BACKEND_BASE_URL"],
              "image_ref": image_ref,
              "built_at": manifest["built_at"],
          }, indent=2) + "\n", encoding="utf-8")
          PY
        env:
          BUILD_RUN_ID: ${{ steps.run.outputs.build_run_id }}
          APP_BACKEND_BASE_URL: ${{ vars.APP_BACKEND_BASE_URL }}

      - name: Write staging environment file
        run: |
          test -n "${{ secrets.APP_ENV_FILE }}"
          printf '%s\n' "${{ secrets.APP_ENV_FILE }}" > .env.staging

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p '${REMOTE_ROOT}'"

      - name: Upload compose bundle
        run: |
          scp compose.yaml docker-compose.staging.yml .env.staging scripts/prune_backend_images.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${REMOTE_ROOT}/"

      - name: Deploy exact image digest to staging
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "REMOTE_ROOT='${REMOTE_ROOT}' COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' IMAGE_REF='${{ steps.manifest.outputs.image_ref }}' GIT_SHA='${{ steps.manifest.outputs.git_sha }}' BUILT_AT='${{ steps.manifest.outputs.built_at }}' bash -s" <<'EOF'
          set -euo pipefail
          mkdir -p "${REMOTE_ROOT}/releases" "${REMOTE_ROOT}/diagnostics"
          cd "${REMOTE_ROOT}"

          if [ -f releases/current.env ]; then
            cp releases/current.env releases/previous.env
          fi

          printf '%s\n' \
            "BACKEND_IMAGE=${IMAGE_REF}" \
            "GIT_SHA=${GIT_SHA}" \
            "DEPLOYED_AT=${BUILT_AT}" > releases/current.env

          docker pull "${IMAGE_REF}"
          docker compose -p "${COMPOSE_PROJECT_NAME}" --env-file releases/current.env --env-file .env.staging \
            -f compose.yaml -f docker-compose.staging.yml up -d postgres backend
          EOF

      - name: Publish staging summary
        run: |
          {
            echo "## Staging Deployment"
            echo
            echo "- Build run: ${{ steps.run.outputs.build_run_id }}"
            echo "- Git SHA: ${{ steps.manifest.outputs.git_sha }}"
            echo "- Image: \`${{ steps.manifest.outputs.image_ref }}\`"
            echo "- URL: ${{ vars.APP_BACKEND_BASE_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run staging smoke checks
        env:
          BASE_URL: ${{ vars.APP_BACKEND_BASE_URL }}
          SMOKE_EMAIL_SECRET: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_EMAIL_VAR: ${{ vars.SMOKE_EMAIL }}
          SMOKE_PASSWORD_SECRET: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_PASSWORD_VAR: ${{ vars.SMOKE_PASSWORD }}
          SMOKE_TENANT_PATH_SECRET: ${{ secrets.SMOKE_TENANT_PATH }}
          SMOKE_TENANT_PATH_VAR: ${{ vars.SMOKE_TENANT_PATH }}
          SMOKE_TENANT_ID_SECRET: ${{ secrets.SMOKE_TENANT_ID }}
          SMOKE_TENANT_ID_VAR: ${{ vars.SMOKE_TENANT_ID }}
        run: |
          mkdir -p diagnostics
          HEALTH_BODY="diagnostics/staging-health.json"
          LOGIN_BODY="diagnostics/staging-login.json"
          PROFILE_BODY="diagnostics/staging-profile.json"
          TENANT_BODY="diagnostics/staging-tenant.json"

          SMOKE_EMAIL="${SMOKE_EMAIL_SECRET:-${SMOKE_EMAIL_VAR:-}}"
          SMOKE_PASSWORD="${SMOKE_PASSWORD_SECRET:-${SMOKE_PASSWORD_VAR:-}}"
          SMOKE_TENANT_PATH="${SMOKE_TENANT_PATH_SECRET:-${SMOKE_TENANT_PATH_VAR:-}}"
          SMOKE_TENANT_ID="${SMOKE_TENANT_ID_SECRET:-${SMOKE_TENANT_ID_VAR:-}}"

          for required in SMOKE_EMAIL SMOKE_PASSWORD SMOKE_TENANT_PATH; do
            if [[ -z "${!required}" ]]; then
              echo "Missing required staging smoke configuration: ${required}" >&2
              exit 1
            fi
          done

          for attempt in {1..18}; do
            HEALTH_STATUS=$(curl -sS -o "${HEALTH_BODY}" -w "%{http_code}" \
              "${BASE_URL}/actuator/health" || true)
            if [[ "${HEALTH_STATUS}" == "200" ]]; then
              break
            fi
            if [[ "${attempt}" == "18" ]]; then
              echo "Staging health check did not become ready; last status=${HEALTH_STATUS}" >&2
              exit 1
            fi
            sleep 10
          done

          LOGIN_STATUS=$(curl -sS -o "${LOGIN_BODY}" -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${SMOKE_EMAIL}\",\"password\":\"${SMOKE_PASSWORD}\"}" \
            "${BASE_URL}/api/v1/auth/login")
          [[ "${LOGIN_STATUS}" == "200" ]]

          ACCESS_TOKEN=$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("diagnostics/staging-login.json").read_text())
          print(data.get("accessToken", ""))
          PY
          )
          [[ -n "${ACCESS_TOKEN}" ]]

          PROFILE_STATUS=$(curl -sS -o "${PROFILE_BODY}" -w "%{http_code}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${BASE_URL}/api/v1/users/me/profile")
          [[ "${PROFILE_STATUS}" == "200" ]]

          TENANT_HEADERS=(-H "Authorization: Bearer ${ACCESS_TOKEN}")
          if [[ -n "${SMOKE_TENANT_ID}" ]]; then
            TENANT_HEADERS+=(-H "X-Tenant-ID: ${SMOKE_TENANT_ID}")
          fi
          TENANT_STATUS=$(curl -sS -o "${TENANT_BODY}" -w "%{http_code}" \
            "${TENANT_HEADERS[@]}" \
            "${BASE_URL}${SMOKE_TENANT_PATH}")
          [[ "${TENANT_STATUS}" == "200" ]]

      - name: Prune stale backend images on staging host
        if: success()
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/anastasia-backend
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "chmod +x '${REMOTE_ROOT}/prune_backend_images.sh' && '${REMOTE_ROOT}/prune_backend_images.sh' '${IMAGE_REPO}'"

      - name: Capture remote diagnostics before rollback
        if: failure()
        run: |
          mkdir -p diagnostics/remote
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "REMOTE_ROOT='${REMOTE_ROOT}' COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${REMOTE_ROOT}"
          docker compose -p "${COMPOSE_PROJECT_NAME}" --env-file releases/current.env --env-file .env.staging \
            -f compose.yaml -f docker-compose.staging.yml ps > diagnostics/compose-ps.txt || true
          docker compose -p "${COMPOSE_PROJECT_NAME}" --env-file releases/current.env --env-file .env.staging \
            -f compose.yaml -f docker-compose.staging.yml logs --tail=200 backend > diagnostics/backend.log || true
          curl -sS http://localhost:8081/actuator/health > diagnostics/health.json || true
          EOF
          scp -r "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${REMOTE_ROOT}/diagnostics/." diagnostics/remote/ || true

      - name: Roll back staging to previous release
        if: failure()
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "REMOTE_ROOT='${REMOTE_ROOT}' COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${REMOTE_ROOT}"
          test -f releases/previous.env
          cp releases/previous.env releases/current.env
          docker compose -p "${COMPOSE_PROJECT_NAME}" --env-file releases/current.env --env-file .env.staging \
            -f compose.yaml -f docker-compose.staging.yml up -d postgres backend
          EOF

      - name: Upload staging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-staging-diagnostics-${{ steps.manifest.outputs.git_sha }}
          path: diagnostics
          if-no-files-found: ignore

      - name: Upload staging release metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: staging-release
          path: staging-release.json
