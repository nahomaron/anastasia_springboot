name: 🚀 Deploy to Staging (with Health Check & Rollback)

on:
  workflow_dispatch:
#  push:
#    branches: [ main ]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: anastasia-backend
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      HEALTH_URL: http://${{ secrets.STAGING_HOST }}:8080/actuator/health

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Log in to GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3️⃣ Build & Push latest image
      - name: Build and Push Docker image
        run: |
          set -euo pipefail
          IMAGE_REFERENCE="$REGISTRY/${{ github.repository_owner }}/${IMAGE_NAME}:latest"
          docker build -t "$IMAGE_REFERENCE" -f Dockerfile .
          docker push "$IMAGE_REFERENCE"
          echo "IMAGE_REFERENCE=$IMAGE_REFERENCE" >> "$GITHUB_ENV"

      # 4️⃣ Create .env.staging file
      - name: 🧩 Create .env.staging from secrets
        run: |
          set -euo pipefail
          echo "SPRING_PROFILES_ACTIVE=staging" > .env.staging
          echo "DB_HOST=postgres" >> .env.staging
          echo "DB_PORT=5432" >> .env.staging
          echo "DB_NAME=anastasia_staging" >> .env.staging
          echo "DB_USER=${{ secrets.STAGING_DB_USER }}" >> .env.staging
          echo "DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}" >> .env.staging
          echo "AWS_ACCESS_KEY=${{ secrets.STAGING_AWS_ACCESS_KEY }}" >> .env.staging
          echo "AWS_SECRET_KEY=${{ secrets.STAGING_AWS_SECRET_KEY }}" >> .env.staging
          echo "JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}" >> .env.staging
          echo "MAIL_API_KEY=${{ secrets.STAGING_MAIL_API_KEY }}" >> .env.staging
          echo "SERVER_PORT=8080" >> .env.staging

      # 5️⃣ Ensure remote workspace exists
      - name: Prepare remote workspace
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ env.STAGING_HOST }}
          username: ${{ env.STAGING_USER }}
          key: ${{ env.STAGING_SSH_KEY }}
          script: |
            mkdir -p /opt/anastasia

      # 6️⃣ Upload compose bundle and environment
      - name: Upload compose bundle
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ env.STAGING_HOST }}
          username: ${{ env.STAGING_USER }}
          key: ${{ env.STAGING_SSH_KEY }}
          source: |
            compose.yaml
            docker-compose.staging.yml
            .env.staging
          target: /opt/anastasia

      # 7️⃣ SSH into server and deploy stack
      - name: Deploy to Staging
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ env.STAGING_HOST }}
          username: ${{ env.STAGING_USER }}
          key: ${{ env.STAGING_SSH_KEY }}
          envs: IMAGE_REFERENCE
          script: |
            set -euo pipefail
            echo "Pulling latest backend image..."
            docker pull "$IMAGE_REFERENCE"

            echo "Starting updated stack..."
            cd /opt/anastasia

            docker compose --env-file .env.staging -f compose.yaml -f docker-compose.staging.yml pull postgres backend
            docker compose --env-file .env.staging -f compose.yaml -f docker-compose.staging.yml up -d postgres backend

            echo "Listing running containers..."
            docker compose --env-file .env.staging -f compose.yaml -f docker-compose.staging.yml ps

      # 8️⃣ Post-deploy Health Check
      - name: Verify Staging Health
        id: healthcheck
        run: |
          echo "Waiting for app to become healthy..."
          MAX_ATTEMPTS=20
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL || echo 000)
            echo "Attempt $i/$MAX_ATTEMPTS → HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Health check failed after $((MAX_ATTEMPTS * 5))s"
          exit 1

      # 9️⃣ Rollback on failure
      - name: Rollback to previous image
        if: failure()
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ env.STAGING_HOST }}
          username: ${{ env.STAGING_USER }}
          key: ${{ env.STAGING_SSH_KEY }}
          envs: IMAGE_REFERENCE
          script: |
            set -euo pipefail
            echo "Rolling back to previous stable image..."
            cd /opt/anastasia
            docker compose --env-file .env.staging -f compose.yaml -f docker-compose.staging.yml down
            docker compose --env-file .env.staging -f compose.yaml -f docker-compose.staging.yml up -d postgres backend
            echo "Rollback complete."

      # 🔟 Report health status
      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful and healthy."
          else
            echo "🚨 Deployment failed or rolled back."
          fi
