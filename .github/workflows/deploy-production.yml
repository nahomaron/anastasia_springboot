name: 🌐 Deploy to Production (with Approval & Health Guardrails)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: anastasia-backend
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      HEALTH_URL: http://${{ secrets.PROD_HOST }}:8080/actuator/health

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Ensure performance gate succeeded
        id: k6-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
import json, os, sys, time, urllib.request, urllib.error

repo = os.environ["GITHUB_REPOSITORY"]
sha = os.environ["GITHUB_SHA"]
token = os.environ["GITHUB_TOKEN"]
output_path = os.environ["GITHUB_OUTPUT"]
api_url = f"https://api.github.com/repos/{repo}/actions/workflows/k6-load.yml/runs?per_page=20"
max_retries = 30
sleep_seconds = 10

for attempt in range(1, max_retries + 1):
    try:
        req = urllib.request.Request(api_url)
        req.add_header("Authorization", f"Bearer {token}")
        req.add_header("Accept", "application/vnd.github+json")
        with urllib.request.urlopen(req) as resp:
            data = json.load(resp)
    except urllib.error.HTTPError as exc:
        print(f"Failed to fetch workflow runs: HTTP {exc.code} {exc.reason}", file=sys.stderr)
        sys.exit(1)

    for run in data.get("workflow_runs", []):
        if run.get("head_sha") != sha:
            continue
        status = run.get("status")
        conclusion = run.get("conclusion")
        print(f"Found K6 run {run.get('id')} → status={status} conclusion={conclusion}", file=sys.stderr)
        if conclusion == "success":
            with open(output_path, "a") as out:
                print(f"k6_run_id={run['id']}", file=out)
            sys.exit(0)
        if status in ("queued", "in_progress"):
            print("K6 run still in progress, waiting...", file=sys.stderr)
            break
        print(f"K6 run concluded as {conclusion}", file=sys.stderr)
        sys.exit(1)
    else:
        print("No matching K6 run yet for this commit.", file=sys.stderr)

    if attempt < max_retries:
        time.sleep(sleep_seconds)

print("Timed out waiting for a successful K6 workflow run.", file=sys.stderr)
sys.exit(1)
          PY

      - name: 📥 Download K6 artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.k6-check.outputs.k6_run_id }}
          path: performance/results

      - name: ☕ Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23
          cache: maven

      - name: 🧰 Grant Maven wrapper permission
        run: chmod +x ./mvnw

      - name: 🧩 Build Docker image & push to GHCR
        run: |
          set -euo pipefail
          IMAGE_REFERENCE="$REGISTRY/${{ github.repository_owner }}/${IMAGE_NAME}:prod"
          docker build -t "$IMAGE_REFERENCE" -f Dockerfile .
          docker push "$IMAGE_REFERENCE"
          echo "IMAGE_REFERENCE=$IMAGE_REFERENCE" >> "$GITHUB_ENV"

      - name: 📝 Write .env.production from secrets
        run: |
          set -euo pipefail
          echo "SPRING_PROFILES_ACTIVE=production" > .env.production
          echo "DB_HOST=${{ secrets.PROD_DB_HOST }}" >> .env.production
          echo "DB_PORT=${{ secrets.PROD_DB_PORT }}" >> .env.production
          echo "DB_NAME=${{ secrets.PROD_DB_NAME }}" >> .env.production
          echo "DB_USER=${{ secrets.PROD_DB_USER }}" >> .env.production
          echo "DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}" >> .env.production
          echo "AWS_ACCESS_KEY=${{ secrets.PROD_AWS_ACCESS_KEY }}" >> .env.production
          echo "AWS_SECRET_KEY=${{ secrets.PROD_AWS_SECRET_KEY }}" >> .env.production
          echo "JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}" >> .env.production
          echo "MAIL_API_KEY=${{ secrets.PROD_MAIL_API_KEY }}" >> .env.production
          echo "SERVER_PORT=8080" >> .env.production

      - name: 📦 Ensure remote workspace exists
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ env.PROD_HOST }}
          username: ${{ env.PROD_USER }}
          key: ${{ env.PROD_SSH_KEY }}
          script: |
            mkdir -p /opt/anastasia

      - name: 📤 Upload production bundle
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ env.PROD_HOST }}
          username: ${{ env.PROD_USER }}
          key: ${{ env.PROD_SSH_KEY }}
          source: |
            compose.yaml
            docker-compose.staging.yml
            .env.production
          target: /opt/anastasia

      - name: 🔄 Deploy production stack
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ env.PROD_HOST }}
          username: ${{ env.PROD_USER }}
          key: ${{ env.PROD_SSH_KEY }}
          envs: IMAGE_REFERENCE
          script: |
            set -euo pipefail
            cd /opt/anastasia
            docker compose --env-file .env.production -f compose.yaml -f docker-compose.staging.yml pull postgres backend
            docker compose --env-file .env.production -f compose.yaml -f docker-compose.staging.yml up -d postgres backend
            docker compose --env-file .env.production -f compose.yaml -f docker-compose.staging.yml ps

      - name: 🩺 Production health check
        run: |
          echo "Waiting for production health..."
          MAX_ATTEMPTS=40
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL || echo 000)
            echo "Attempt $i/$MAX_ATTEMPTS → HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Production health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Production health check failed"
          exit 1

      - name: 🔁 Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ env.PROD_HOST }}
          username: ${{ env.PROD_USER }}
          key: ${{ env.PROD_SSH_KEY }}
          envs: IMAGE_REFERENCE
          script: |
            set -euo pipefail
            cd /opt/anastasia
            docker compose --env-file .env.production -f compose.yaml -f docker-compose.staging.yml down
            docker compose --env-file .env.production -f compose.yaml -f docker-compose.staging.yml up -d postgres backend
            echo "Rollback complete."
