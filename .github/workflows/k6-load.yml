name: k6 Load Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  k6-load:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23
          cache: maven

      - name: Build (skip tests)
        run: ./mvnw -DskipTests package

      - name: Start Spring Boot (background)
        run: |
          echo "Starting Spring Boot jar with test profile..."
          nohup java -jar target/*.jar --spring.profiles.active=test --server.port=8080 > app.log 2>&1 &
          
          echo "Waiting for application health check..."
          ATTEMPTS=60
          for i in $(seq 1 $ATTEMPTS); do
            if curl -sSf http://localhost:8080/actuator/health > /dev/null; then
              echo "Application is healthy (attempt $i/${ATTEMPTS})."
              exit 0
            fi
            echo "Attempt $i/${ATTEMPTS}: application not yet ready."
            sleep 2
          done
          
          echo "Application failed to start within $((ATTEMPTS * 2)) seconds."
          tail -n 100 app.log
          exit 1
        env:
          MAVEN_OPTS: -Xmx1g

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 load test
        run: |
          k6 run k6/auth_flow.js \
            -e BASE_URL=http://localhost:8080/api/v1 \
            --summary-export=k6-summary.json
        continue-on-error: false

      - name: Upload k6 summary
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: k6-summary.json

      - name: Upload app log (helpful if failing)
        uses: actions/upload-artifact@v4
        with:
          name: spring-app-log
          path: app.log
