name: ⚡ K6 Load & Performance Dashboard

on:
  workflow_dispatch:        # manual trigger
  push:
    branches: [ main, dev ]

jobs:
  # ------------------------------------------------------------
  # 1️⃣ Run each K6 test (auth, user, member) in parallel
  # ------------------------------------------------------------
  k6-load-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        script: [auth, user, member]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23
          cache: maven

      - name: 🏗️ Build backend (skip tests)
        run: ./mvnw clean package -DskipTests

      - name: 🚀 Start Spring Boot backend
        run: |
          nohup java -jar target/*.jar --spring.profiles.active=test > app.log 2>&1 &
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep -q "UP"; then
              echo "✅ Backend healthy"
              break
            fi
            echo "Waiting for backend ($i/30)..."
            sleep 3
          done
          tail -n 10 app.log

      - name: 📦 Install k6
        uses: grafana/setup-k6-action@v1

      - name: > 
          Run K6 Performance Test: ${{ matrix.script }}
        run: |
          mkdir -p performance/results
          k6 run performance/k6/scripts/${{ matrix.script }}-performance.js \
            -e BASE_URL=http://localhost:8080/api/v1 \
            --summary-export=performance/results/${{ matrix.script }}-summary.json
        continue-on-error: false

      - name: 📤 Upload K6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary-${{ matrix.script }}
          path: performance/results/${{ matrix.script }}-summary.json

  # ------------------------------------------------------------
  # 2️⃣ Merge results and generate Allure dashboard
  # ------------------------------------------------------------
  merge-performance-results:
    runs-on: ubuntu-latest
    needs: [k6-load-matrix]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Download all K6 summaries
        uses: actions/download-artifact@v4
        with:
          path: performance/results

      - name: 🧩 Merge K6 summaries into Allure environment
        run: |
          python3 performance/scripts/merge_k6_to_allure.py

      - name: 🧮 Generate Allure Performance Results
        run: |
          python3 performance/scripts/generate_allure_perf_results.py

      - name: 📊 Generate Allure HTML Performance Report
        uses: simple-elf/allure-report-action@v1.13
        with:
          allure_results: target/allure-results
          allure_report: allure-performance-report

      - name: 📤 Upload Performance Allure HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-performance-html
          path: allure-performance-report/

  # ------------------------------------------------------------
  # 3️⃣ Auto-publish dashboard to GitHub Pages
  # ------------------------------------------------------------
  publish-performance-dashboard:
    runs-on: ubuntu-latest
    needs: [merge-performance-results]

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Allure performance artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-performance-html
          path: allure-performance-report

      - name: 🚀 Deploy Allure Performance Dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-performance-report
          keep_files: false
