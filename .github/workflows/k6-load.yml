name: K6 Load

on:
  workflow_run:
    workflows: ["Deploy Staging"]
    types: [completed]
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Deploy Staging workflow run id that published the staging-release artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.release.outputs.base_url }}
      git_sha: ${{ steps.release.outputs.git_sha }}
      build_run_id: ${{ steps.release.outputs.build_run_id }}
    steps:
      - name: Resolve staging run id
        id: run
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "staging_run_id=${{ inputs.staging_run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "staging_run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Download staging release metadata
        uses: actions/download-artifact@v4
        with:
          name: staging-release
          path: artifacts/staging-release
          run-id: ${{ steps.run.outputs.staging_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Parse staging release metadata
        id: release
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("artifacts/staging-release/staging-release.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"base_url={release['staging_url']}/api/v1\n")
              fh.write(f"git_sha={release['git_sha']}\n")
              fh.write(f"build_run_id={release['build_run_id']}\n")
          PY

  k6-load:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: prepare
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        script: [auth, user, member]
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Run k6 scenario
        env:
          BASE_URL: ${{ needs.prepare.outputs.base_url }}
          OWNER_EMAIL: ${{ secrets.K6_OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.K6_OWNER_PASSWORD }}
          OWNER_PHONE: ${{ secrets.K6_OWNER_PHONE }}
        run: |
          mkdir -p performance/results
          k6 run "performance/k6/scripts/${{ matrix.script }}-performance.js" \
            -e BASE_URL="${BASE_URL}" \
            -e OWNER_EMAIL="${OWNER_EMAIL}" \
            -e OWNER_PASSWORD="${OWNER_PASSWORD}" \
            -e OWNER_PHONE="${OWNER_PHONE}" \
            --summary-export="performance/results/${{ matrix.script }}-summary.json"
      - name: Upload k6 scenario summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary-${{ matrix.script }}-${{ needs.prepare.outputs.git_sha }}
          path: performance/results/${{ matrix.script }}-summary.json
          if-no-files-found: ignore

  summarize:
    runs-on: ubuntu-latest
    needs: [prepare, k6-load]
    if: ${{ needs.prepare.result == 'success' && always() }}
    steps:
      - uses: actions/checkout@v4
      - name: Download all k6 summaries
        uses: actions/download-artifact@v4
        with:
          path: performance/results
          pattern: k6-summary-*-${{ needs.prepare.outputs.git_sha }}
          merge-multiple: true
      - name: Generate merged performance artifacts
        run: |
          python3 performance/scripts/merge_k6_to_allure.py
          python3 performance/scripts/generate_allure_perf_results.py
      - name: Upload merged k6 summary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-summary-${{ needs.prepare.outputs.git_sha }}
          path: |
            performance/results
            target/allure-results
          if-no-files-found: ignore
      - name: Publish job summary
        run: |
          {
            echo "## K6 Gate"
            echo
            echo "- Git SHA: ${{ needs.prepare.outputs.git_sha }}"
            echo "- Build run: ${{ needs.prepare.outputs.build_run_id }}"
            echo "- Base URL: ${{ needs.prepare.outputs.base_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Evaluate k6 result
        run: |
          if [[ "${{ needs.k6-load.result }}" != "success" ]]; then
            exit 1
          fi
