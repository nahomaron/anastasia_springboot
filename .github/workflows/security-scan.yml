name: 🔒 Security & Dependency Checks

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23
          cache: maven

      - name: 🧪 Run OWASP Dependency-Check
        uses: owasp/dependency-check-action@v3
        with:
          project: anastasia-backend
          scan-path: .
          format: ALL
          output-directory: target/dependency-check-reports
          fail-on-cvss: 7

