name: API Automation Tests (api-tests.yml)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      SPRING_PROFILES_ACTIVE: test
      ALLURE_RESULTS_DIR: target/allure-results
      BASE_URL: http://localhost:8080
      CLEANUP_ON_EXIT: "false"
      CLEANUP_ON_FAILURE_ONLY: "true"

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23
          cache: maven

      - name: ⚙️ Configure Testcontainers
        run: |
          echo "TESTCONTAINERS_CHECKS_DISABLE=true" >> $GITHUB_ENV
          echo "TESTCONTAINERS_RYUK_DISABLED=false" >> $GITHUB_ENV

      - name: 🧰 Grant execute permission for Maven wrapper
        run: chmod +x ./mvnw

      # ---------------------------------------------------
      # 1️⃣ INTERNAL TESTS – Run integration/unit suite
      # ---------------------------------------------------
      - name: 🧩 Run internal Testcontainers integration tests
        run: |
          echo "Running internal integration tests..."
          ./mvnw verify -Ptest -B
        env:
          SPRING_PROFILES_ACTIVE: test

      # ---------------------------------------------------
      # 2️⃣ BUILD & START BACKEND
      # ---------------------------------------------------
      - name: 🏗️ Build Spring Boot backend (skip tests)
        run: ./mvnw clean package -DskipTests

      - name: 🚀 Start backend with test profile
        run: |
          echo "Starting backend with test profile..."
          nohup java -jar target/*.jar --spring.profiles.active=test > server.log 2>&1 &
          
          MAX_ATTEMPTS=24
          SLEEP_SECONDS=5
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if curl -s http://localhost:8080/actuator/health | grep -q "UP"; then
              echo "✅ Backend is up after $((i * SLEEP_SECONDS))s"
              break
            fi
            echo "Waiting for backend... ($i/$MAX_ATTEMPTS)"
            sleep $SLEEP_SECONDS
            if [ $i -eq $MAX_ATTEMPTS ]; then
              echo "❌ Backend failed to start"
              tail -n 50 server.log
              exit 1
            fi
          done
          echo "Last 20 lines of server.log:"
          tail -n 20 server.log

      # ---------------------------------------------------
      # 3️⃣ BLACK-BOX TESTS – RestAssured API suite
      # ---------------------------------------------------
      - name: 🧪 Run RestAssured black-box API tests
        run: |
          echo "Running external API tests against running backend..."
          ./mvnw test -Ptest-server -B
        env:
          BASE_URL: http://localhost:8080
          SPRING_PROFILES_ACTIVE: test

      # ---------------------------------------------------
      # 4️⃣ CLEANUP & REPORTING
      # ---------------------------------------------------
      - name: 🛑 Stop Spring Boot backend
        if: always()
        run: |
          SERVER_PID=$(lsof -t -i:8080 || pgrep -f "java -jar target/*.jar" || true)
          if [ -n "$SERVER_PID" ]; then
            echo "Stopping backend (PID: $SERVER_PID)"
            kill $SERVER_PID
            sleep 5
          else
            echo "No backend process found."
          fi


      # ---------------------------------------------------
      # 🧩 Merge Allure results from both suites
      # ---------------------------------------------------
      - name: 🧩 Merge Allure results (integration + api)
        run: |
          mkdir -p target/allure-results
          cp -r target/allure-results/integration/* target/allure-results/ 2>/dev/null || true
          cp -r target/allure-results/api/* target/allure-results/ 2>/dev/null || true

      # ---------------------------------------------------
      # 🔗 Merge k6 summaries into Allure environment
      # ---------------------------------------------------
      - name: Merge k6 summaries into Allure environment
        run: |
          python3 performance/scripts/merge_k6_to_allure.py

      - name: Generate detailed Allure performance results
        run: |
          python3 performance/scripts/generate_allure_perf_results.py

      # ---------------------------------------------------
      # 🧮 Generate and upload Allure HTML report
      # ---------------------------------------------------
      - name: 🧮 Generate Allure HTML report
        if: always()
        uses: simple-elf/allure-report-action@v1.6
        with:
          allure_results: target/allure-results
          allure_report: allure-html-report-dir

      - name: 📤 Upload Allure HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-html-report-dir/

      - name: 📁 Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-raw
          path: target/allure-results/

      - name: 🧾 Archive Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
