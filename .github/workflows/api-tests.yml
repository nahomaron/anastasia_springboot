name:  API Automation Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23
          cache: maven

      - name: Grant execute permission for Maven wrapper
        run: chmod +x ./mvnw

      - name: Build Spring Boot backend (skip tests)
        run: ./mvnw clean package -DskipTests

      - name: Start backend with test profile
        run: |
          echo "Starting backend with test profile..."
          nohup java -jar target/*.jar --spring.profiles.active=test > server.log 2>&1 &
          # Health-check loop instead of fixed sleep
          for i in {1..10}; do
            if curl -s http://localhost:8080/actuator/health | grep -q "UP"; then
              echo "Backend is up!"
              break
            fi
            echo "Waiting for backend to start..."
            sleep 5
          done
          tail -n 20 server.log

      - name: Run RestAssured API tests
        run: ./mvnw test -Papi
        env:
          SPRING_PROFILES_ACTIVE: test
          BASE_URL: http://localhost:8080/api/v1

      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
