name: API Automation Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  api-tests:
    # 💡 Best Practice: Use a stable LTS version for CI, like JDK 21
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SPRING_PROFILES_ACTIVE: test
      ALLURE_RESULTS_DIR: target/allure-results
#      MAVEN_OPTS: "-Dmaven.test.failure.ignore=true"

      # Default cleanup behavior — overridden per branch below
      CLEANUP_ON_EXIT: "false"
      CLEANUP_ON_FAILURE_ONLY: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ☕️ Using JDK 21 (LTS) for stability
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23
          cache: maven

      - name: Grant execute permission for Maven wrapper
        run: chmod +x ./mvnw

      # 🧹 Configure cleanup behavior per branch
      - name: Configure cleanup behavior per branch
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "CLEANUP_ON_EXIT=true" >> $GITHUB_ENV
            echo "CLEANUP_ON_FAILURE_ONLY=false" >> $GITHUB_ENV
            echo "Cleanup mode: Always cleanup (PR run)"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "CLEANUP_ON_EXIT=false" >> $GITHUB_ENV
            echo "CLEANUP_ON_FAILURE_ONLY=true" >> $GITHUB_ENV
            echo "Cleanup mode: Cleanup only on failure (main branch)"
          else
            echo "CLEANUP_ON_EXIT=false" >> $GITHUB_ENV
            echo "CLEANUP_ON_FAILURE_ONLY=false" >> $GITHUB_ENV
            echo "Cleanup mode: Skip cleanup (default)"

      # 📦 Phase 1: Build & Start Backend
      - name: Build Spring Boot backend (skip tests)
        run: ./mvnw clean package -DskipTests

      - name: Start backend with test profile
        run: |
            echo "Starting backend with test profile..."
            # Start in background, redirecting output
            nohup java -jar target/*.jar --spring.profiles.active=test > server.log 2>&1 &
            
            # Health-check loop (120 seconds max)
            MAX_ATTEMPTS=24
            SLEEP_SECONDS=5
            TIMEOUT_SECONDS=$((MAX_ATTEMPTS * SLEEP_SECONDS))
            
            for i in $(seq 1 $MAX_ATTEMPTS); do
              if curl -s http://localhost:8080/actuator/health | grep -q "UP"; then
                echo "Backend is up after $((i * SLEEP_SECONDS)) seconds!"
                break
              fi
            
              # **FIXED LOGGING:** Now consistently uses MAX_ATTEMPTS
              echo "Waiting for backend to start... (Attempt $i/$MAX_ATTEMPTS)"
              sleep $SLEEP_SECONDS
            
              if [ $i -eq $MAX_ATTEMPTS ]; then
                # **FIXED TIMEOUT MESSAGE:** Displays the calculated timeout
                echo "Health check failed after $TIMEOUT_SECONDS seconds. Aborting."
                tail -n 50 server.log
                exit 1
              fi
            done
            
            echo "Last 20 lines of server log:"
            tail -n 20 server.log
      # 🧪 Phase 2: Run Tests

      - name: Run RestAssured API tests
        # The 'test' profile must ensure Allure results are generated in target/allure-results
        run: ./mvnw test -Papi
        env:
          SPRING_PROFILES_ACTIVE: test
          BASE_URL: http://localhost:8080


      - name: Generate Allure HTML report
        if: always()
        uses: simple-elf/allure-report-action@v1.6
        with:
          allure_results_path: target/allure-results
          report_path: allure-html-report-dir # Define a clean output directory name

      # Upload Allure HTML report for deployment
      - name: Upload Allure HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-html-report-dir/ # Upload the directory generated by the action

      # Optional: Upload raw results for local debugging
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-raw
          path: target/allure-results/

      # Archive test reports (optional, but good practice)
      - name: Archive Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  deploy-allure-report:
    needs: api-tests
    # Run always, but only deploy from main
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository (required for gh-pages)
        uses: actions/checkout@v4

      - name: Download Allure HTML artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-html-report
          path: allure-report

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: false
