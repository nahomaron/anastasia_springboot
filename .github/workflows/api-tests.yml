name: API Automation Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  api-tests:
    # 💡 Best Practice: Use a stable LTS version for CI, like JDK 21
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ☕️ Using JDK 21 (LTS) for stability
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23
          cache: maven

      - name: Grant execute permission for Maven wrapper
        run: chmod +x ./mvnw

      # 📦 Phase 1: Build & Start Backend
      - name: Build Spring Boot backend (skip tests)
        run: ./mvnw clean package -DskipTests

      - name: Start backend with test profile
        run: |
          echo "Starting backend with test profile..."
          # Start in background, redirecting output
          nohup java -jar target/*.jar --spring.profiles.active=test > server.log 2>&1 &
          
          # Health-check loop for robust startup
          for i in {1..24}; do
            if curl -s http://localhost:8080/actuator/health | grep -q "UP"; then
              echo "Backend is up after $((i * 5)) seconds!"
              break
            fi
            echo "Waiting for backend to start... (Attempt $i/15)"
            sleep 5
            if [ $i -eq 15 ]; then
              echo "Health check failed after 75 seconds. Aborting."
              tail -n 50 server.log
              exit 1
            fi
          done
          
          echo "Last 20 lines of server log:"
          tail -n 20 server.log

      # 🧪 Phase 2: Run Tests
      - name: Run RestAssured API tests
        # The 'test' profile must ensure Allure results are generated in target/allure-results
        run: ./mvnw test -Papi
        env:
          SPRING_PROFILES_ACTIVE: test
          BASE_URL: http://localhost:8080/api/v1

      # 📝 Phase 3: Allure Report Generation (The Fix)
      # ➡️ FIX: Using a dedicated action to generate the report ensures the CLI is present.
      - name: ⚙️ Generate Allure HTML report
        # The report is generated from the results in target/allure-results/
        # This action places the deployable report into the default folder 'allure-report'
        if: always()
        uses: simple-elf/allure-report-action@v1.6
        with:
          allure_results_path: target/allure-results
          report_path: allure-html-report-dir # Define a clean output directory name

      # 🌐 Upload Allure HTML report for deployment
      - name: 🌐 Upload Allure HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-html-report-dir/ # Upload the directory generated by the action

      # 📦 Optional: Upload raw results for local debugging
      - name: 📦 Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-raw
          path: target/allure-results/

      # Archive test reports (optional, but good practice)
      - name: Archive Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  deploy-allure-report:
    needs: api-tests
    # Only run deployment if the main branch is pushed or if the tests job failed (to show failures)
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: ⬇️ Download Allure HTML artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-html-report
          path: allure-report

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report # This is the directory we downloaded the artifact into
          publish_branch: gh-pages
          keep_files: false
