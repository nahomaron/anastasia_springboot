name: CI

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Grant Maven wrapper permission
        run: chmod +x ./mvnw
      - name: Compile
        run: ./mvnw -q -DskipTests compile

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Grant Maven wrapper permission
        run: chmod +x ./mvnw
      - name: Run unit tests
        run: ./mvnw -q test jacoco:report -Dgroups=!experimental
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-unit-surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-unit-jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-unit-allure-results
          path: target/allure-results
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Grant Maven wrapper permission
        run: chmod +x ./mvnw
      - name: Run integration tests
        run: ./mvnw -q -Ptest verify -DskipApiTests=true
      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-integration-failsafe-reports
          path: target/failsafe-reports
          if-no-files-found: ignore
      - name: Upload integration Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-integration-allure-results
          path: target/allure-results
          if-no-files-found: ignore

  api:
    if: ${{ vars.CI_RUN_API_TESTS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Grant Maven wrapper permission
        run: chmod +x ./mvnw
      - name: Run black-box API tests
        env:
          BASE_URL: ${{ vars.CI_API_BASE_URL }}
        run: ./mvnw -q -Papi-tests test
      - name: Upload API surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-api-surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
      - name: Upload API Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-api-allure-results
          path: target/allure-results
          if-no-files-found: ignore

  checkstyle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Grant Maven wrapper permission
        run: chmod +x ./mvnw
      - name: Checkstyle
        run: ./mvnw -q checkstyle:check

  spotbugs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Grant Maven wrapper permission
        run: chmod +x ./mvnw
      - name: SpotBugs
        run: ./mvnw -q -DskipTests compile spotbugs:check

  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - compile
      - unit
      - integration
      - checkstyle
      - spotbugs
      - api
    if: ${{ always() }}
    steps:
      - name: Evaluate CI result
        run: |
          if [[ "${{ needs.compile.result }}" != "success" ]] || \
             [[ "${{ needs.unit.result }}" != "success" ]] || \
             [[ "${{ needs.integration.result }}" != "success" ]] || \
             [[ "${{ needs.checkstyle.result }}" != "success" ]] || \
             [[ "${{ needs.spotbugs.result }}" != "success" ]]; then
            exit 1
          fi

          if [[ "${{ vars.CI_RUN_API_TESTS }}" == "true" && "${{ needs.api.result }}" != "success" ]]; then
            exit 1
          fi
