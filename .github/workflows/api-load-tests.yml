name: API Load & Integration Tests

on:
  workflow_dispatch:           # manual trigger
  schedule:
    - cron: "0 3 * * *"        # optional: nightly at 3 AM UTC
  push:
    branches: [ main ]

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Build all images (uses your multi-stage Dockerfile)
      - name: Build Docker images
        run: docker compose build

      # 4️⃣ Start backend + database in detached mode
      - name: Start backend stack
        run: docker compose up -d postgres backend

      # 5️⃣ Wait for backend to be healthy
      - name: Wait for backend health check
        run: |
          echo "Waiting for backend to become healthy..."
          MAX_ATTEMPTS=30
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' anastasia_backend 2>/dev/null || echo "unknown")
            echo "Attempt $i/$MAX_ATTEMPTS: $STATUS"
            if [[ "$STATUS" == "\"healthy\"" ]]; then
              echo "✅ Backend is healthy!"
              break
            fi
            if [ $i -eq $MAX_ATTEMPTS ]; then
              echo "❌ Backend did not become healthy in time"
              docker logs anastasia_backend
              exit 1
            fi
            sleep 5
          done

      # 6️⃣ Run k6 load tests (Grafana Cloud upload handled automatically)
      - name: Run k6 smoke test
        run: docker compose run k6

      # 7️⃣ Collect logs and results for troubleshooting
      - name: Collect container logs
        if: always()
        run: |
          mkdir -p logs
          docker logs anastasia_backend > logs/backend.log 2>&1 || true
          docker logs anastasia_postgres_container > logs/postgres.log 2>&1 || true

      # 8️⃣ Upload artifacts (optional)
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: logs/

      # 9️⃣ Shut down stack
      - name: Shut down containers
        if: always()
        run: docker compose down -v
