<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{email/layouts/base :: emailLayout('Reset your password', 'Password reset request', ~{::bodyContent})}">
    <th:block th:fragment="bodyContent">
        <h1 style="margin:0 0 12px 0; font-size:22px; color:#0F172A;">Password reset request</h1>
        <p style="margin:0 0 12px 0; font-size:15px; color:#334155;">Hello <span th:text="${username}">User</span>,</p>
        <p style="margin:0 0 12px 0; font-size:15px; color:#334155;">Use the secure link below to reset your password.</p>
        <th:block th:replace="~{email/components/codeBox :: codeBox(${reset_token}, 60)}"></th:block>
        <th:block th:replace="~{email/components/button :: button(${reset_url}, 'Reset password', 'primary')}"></th:block>
        <th:block th:replace="~{email/components/plainLink :: plainLink(${reset_url})}"></th:block>
        <th:block th:replace="~{email/components/alert :: alert('warn', 'If you did not request this, ignore this email or contact support.')}"></th:block>
    </th:block>
</th:block>
</body>
</html>
