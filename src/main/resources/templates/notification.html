<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{email/layouts/base :: emailLayout('Notification', 'You have a new notification', ~{::bodyContent})}">
    <th:block th:fragment="bodyContent">
        <h1 style="margin:0 0 12px 0; font-size:22px; color:#0F172A;">Anastasia notification</h1>
        <p style="margin:0 0 12px 0; font-size:15px; color:#334155;">Hello <span th:text="${username}">User</span>,</p>
        <p style="margin:0; font-size:15px; color:#334155; white-space:pre-line;" th:text="${message_content}">Notification content.</p>
    </th:block>
</th:block>
</body>
</html>
