<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{email/layouts/base :: emailLayout('Activate your account', 'Your activation code is inside', ~{::bodyContent})}">
    <th:block th:fragment="bodyContent">
        <h1 style="margin:0 0 12px 0; font-size:22px; color:#0F172A;">Account activation</h1>
        <p style="margin:0 0 12px 0; font-size:15px; color:#334155;">Hello <span th:text="${username}">User</span>,</p>
        <p style="margin:0 0 12px 0; font-size:15px; color:#334155;">Use the code below to activate your account.</p>
        <th:block th:replace="~{email/components/codeBox :: codeBox(${activation_code}, 15)}"></th:block>
        <th:block th:replace="~{email/components/button :: button(${confirmation_url}, 'Activate account', 'primary')}"></th:block>
        <th:block th:replace="~{email/components/plainLink :: plainLink(${confirmation_url})}"></th:block>
    </th:block>
</th:block>
</body>
</html>
