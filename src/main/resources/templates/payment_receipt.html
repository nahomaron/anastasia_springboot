<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{email/layouts/base :: emailLayout('Payment receipt', 'Your payment was received', ~{::bodyContent})}">
    <th:block th:fragment="bodyContent">
        <h1 style="margin:0 0 12px 0; font-size:22px; color:#0F172A;">Payment confirmation</h1>
        <p style="margin:0 0 12px 0; font-size:15px; color:#334155;">We received your payment successfully.</p>
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:10px 0;">
            <th:block th:replace="~{email/components/fieldRow :: fieldRow('Amount', ${amount + ' ' + currency})}"></th:block>
            <th:block th:replace="~{email/components/fieldRow :: fieldRow('Payment ID', ${paymentId})}"></th:block>
        </table>
    </th:block>
</th:block>
</body>
</html>
