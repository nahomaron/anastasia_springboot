<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="alert(type, text)">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" class="email-alert"
           th:classappend="${type == 'success' ? ' email-alert-success' : (type == 'warn' ? ' email-alert-warn' : (type == 'danger' ? ' email-alert-danger' : ' email-alert-info'))}"
           style="margin:14px 0; border-radius:10px;"
           th:styleappend="${type == 'success' ? 'background-color:#ECFDF3; border:1px solid #CBEFD9;' : (type == 'warn' ? 'background-color:#FFF7E8; border:1px solid #F8E0AD;' : (type == 'danger' ? 'background-color:#FFF1F2; border:1px solid #F8CDD2;' : 'background-color:#EFF6FF; border:1px solid #D6E8FF;'))}">
        <tr>
            <td class="email-alert-text" style="padding:12px 14px; font-size:14px; line-height:1.5; color:#334155;" th:text="${text}">Callout</td>
        </tr>
    </table>
</th:block>
</html>
