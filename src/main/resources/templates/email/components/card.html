<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="card(sectionTitle, bodyContent)">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:14px 0; border:1px solid #E7EAF0; border-radius:12px; background-color:#FFFFFF;">
        <tr>
            <td style="padding:18px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size:15px; line-height:1.5; color:#0F172A;">
                <p th:if="${sectionTitle != null and !#strings.isEmpty(sectionTitle)}" th:text="${sectionTitle}" style="margin:0 0 10px 0; font-size:16px; font-weight:700; color:#0F172A;">Section</p>
                <th:block th:insert="${bodyContent}"></th:block>
            </td>
        </tr>
    </table>
</th:block>
</html>
