<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="eventDetails(date, time, location, calendarUrl)">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:14px 0; border:1px solid #E7EAF0; border-radius:12px; background-color:#FFFFFF;">
        <tr>
            <td style="padding:16px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                    <tr>
                        <td style="padding:6px 0; width:28%; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size:14px; color:#64748B;">Date</td>
                        <td style="padding:6px 0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size:14px; color:#0F172A;" th:text="${date}">Date</td>
                    </tr>
                    <tr>
                        <td style="padding:6px 0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size:14px; color:#64748B;">Time</td>
                        <td style="padding:6px 0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size:14px; color:#0F172A;" th:text="${time}">Time</td>
                    </tr>
                    <tr>
                        <td style="padding:6px 0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size:14px; color:#64748B;">Location</td>
                        <td style="padding:6px 0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size:14px; color:#0F172A;" th:text="${location}">Location</td>
                    </tr>
                </table>
                <p style="margin:10px 0 0 0;" th:if="${calendarUrl != null and !#strings.isEmpty(calendarUrl)}">
                    <a th:href="${calendarUrl}" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size:14px; color:#3B5BFF; text-decoration:none;">Add to calendar</a>
                </p>
            </td>
        </tr>
    </table>
</th:block>
</html>
