<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="button(url, label, variant)">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 14px 0 10px 0;">
        <tr>
            <td th:attr="bgcolor=${variant == 'secondary' ? '#FFFFFF' : '#3B5BFF'}"
                th:classappend="${variant == 'secondary' ? ' email-cta-secondary' : ' email-cta-primary'}"
                style="border-radius:12px;"
                th:styleappend="${variant == 'secondary' ? 'border:1px solid #3B5BFF;' : 'border:1px solid #3B5BFF;'}">
                <a th:href="${url}" target="_blank"
                   class="email-cta-link"
                   style="display:inline-block; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size:15px; line-height:15px; font-weight:600; text-decoration:none; border-radius:12px; padding:13px 20px;"
                   th:styleappend="${variant == 'secondary' ? 'color:#3B5BFF;' : 'color:#FFFFFF;'}"
                   th:text="${label}">Open</a>
            </td>
        </tr>
    </table>
</th:block>
</html>
