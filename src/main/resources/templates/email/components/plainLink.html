<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="plainLink(url)">
    <p class="email-plain-link-copy" style="margin:8px 0 0 0; font-size:14px; color:#64748B; line-height:1.5;">
        If the button does not work, use this link:
        <br/>
        <a th:href="${url}" th:text="${url}" class="email-link" style="color:#3B5BFF; word-break:break-all; text-decoration:none;">https://app.anastasia.com</a>
    </p>
</th:block>
</html>
