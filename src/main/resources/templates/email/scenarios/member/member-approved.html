<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{email/layouts/base :: emailLayout(${subjectLine}, 'Your membership is approved', ~{::bodyContent})}">
    <th:block th:fragment="bodyContent">
        <h1 style="margin:0 0 12px 0; font-size:22px; color:#0F172A;">Membership approved</h1>
        <p style="margin:0 0 12px 0; font-size:15px; color:#334155;">Hello <span th:text="${memberName}">Member</span>,</p>
        <p style="margin:0 0 12px 0; font-size:15px; color:#334155;">Your membership at <span th:text="${churchName}">Church</span> is approved. You can now access your member portal.</p>
        <th:block th:replace="~{email/components/button :: button(${portalUrl}, 'Open Member Portal', 'primary')}"></th:block>
        <th:block th:replace="~{email/components/plainLink :: plainLink(${portalUrl})}"></th:block>
    </th:block>
</th:block>
</body>
</html>
