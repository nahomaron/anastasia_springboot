<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{email/layouts/base :: emailLayout(${subjectLine}, 'Your verification code is inside', ~{::bodyContent})}">
    <th:block th:fragment="bodyContent">
        <h1 style="margin:0 0 12px 0; font-size:22px; line-height:1.35; color:#0F172A;">Verify your email</h1>
        <p style="margin:0 0 10px 0; font-size:15px; color:#334155;">Hello <span th:text="${userName}">User</span>,</p>
        <p style="margin:0 0 14px 0; font-size:15px; color:#334155;">Use this one-time verification code to continue.</p>
        <th:block th:replace="~{email/components/codeBox :: codeBox(${code}, ${expiresMinutes})}"></th:block>
        <th:block th:replace="~{email/components/alert :: alert('warn', 'If you did not request this code, ignore this email or contact support.')}"></th:block>
        <p style="margin:12px 0 0 0; font-size:14px; color:#64748B;">Request IP: <span th:text="${requestIp}">203.0.113.10</span></p>
        <p style="margin:4px 0 0 0; font-size:14px; color:#64748B;" th:if="${requestDevice != null}" th:text="${'Device: ' + requestDevice}">Device</p>
        <p style="margin:14px 0 0 0; font-size:14px;"><a th:href="${helpUrl}" style="color:#3B5BFF; text-decoration:none;">Security help center</a></p>
    </th:block>
</th:block>
</body>
</html>
