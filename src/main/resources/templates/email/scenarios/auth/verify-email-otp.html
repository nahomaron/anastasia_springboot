<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{email/layouts/base :: emailLayout(${subjectLine}, #{email.auth.verifyOtp.preheader}, ~{::bodyContent})}">
    <th:block th:fragment="bodyContent">
        <h1 style="margin:0 0 12px 0; font-size:22px; line-height:1.35; color:#0F172A;" th:text="#{email.auth.verifyOtp.title}">Verify your email</h1>
        <p style="margin:0 0 10px 0; font-size:15px; color:#334155;" th:text="#{email.auth.verifyOtp.greeting(${userName})}">Hello User,</p>
        <p style="margin:0 0 14px 0; font-size:15px; color:#334155;" th:text="#{email.auth.verifyOtp.intro}">Use this one-time verification code to continue.</p>
        <th:block th:replace="~{email/components/codeBox :: codeBox(${code}, ${expiresMinutes})}"></th:block>
        <th:block th:replace="~{email/components/alert :: alert('warn', #{email.auth.verifyOtp.alert})}"></th:block>
        <p class="email-muted-text" style="margin:12px 0 0 0; font-size:14px; color:#64748B;" th:text="#{email.auth.verifyOtp.requestIp(${requestIp})}">Request IP: 203.0.113.10</p>
        <p class="email-muted-text" style="margin:4px 0 0 0; font-size:14px; color:#64748B;" th:if="${requestDevice != null}" th:text="#{email.auth.verifyOtp.requestDevice(${requestDevice})}">Device</p>
        <p style="margin:14px 0 0 0; font-size:14px;" th:if="${helpUrl != null and !#strings.isEmpty(helpUrl)}"><a th:href="${helpUrl}" class="email-link" style="color:#3B5BFF; text-decoration:none;" th:text="#{email.auth.verifyOtp.help}">Security help center</a></p>
    </th:block>
</th:block>
</body>
</html>
