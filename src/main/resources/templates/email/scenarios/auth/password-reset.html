<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{email/layouts/base :: emailLayout(${subjectLine}, #{email.auth.passwordReset.preheader}, ~{::bodyContent})}">
    <th:block th:fragment="bodyContent">
        <h1 style="margin:0 0 12px 0; font-size:22px; color:#0F172A;" th:text="#{email.auth.passwordReset.title}">Reset your password</h1>
        <p style="margin:0 0 12px 0; font-size:15px; color:#334155;" th:text="#{email.auth.passwordReset.greeting(${userName})}">Hello User,</p>
        <p style="margin:0 0 12px 0; font-size:15px; color:#334155;" th:text="#{email.auth.passwordReset.intro}">We received a request to reset your password.</p>
        <th:block th:replace="~{email/components/button :: button(${resetUrl}, #{email.auth.passwordReset.cta}, 'primary')}"></th:block>
        <th:block th:replace="~{email/components/plainLink :: plainLink(${resetUrl})}"></th:block>
        <th:block th:replace="~{email/components/alert :: alert('warn', #{email.auth.passwordReset.alert})}"></th:block>
        <p class="email-muted-text" style="margin:10px 0 0 0; font-size:14px; color:#64748B;" th:text="#{email.auth.passwordReset.expiry(${expiresHours})}">This link expires in 1 hour.</p>
        <p class="email-muted-text" style="margin:4px 0 0 0; font-size:14px; color:#64748B;" th:text="#{email.auth.passwordReset.requestIp(${requestIp})}">Request IP: 203.0.113.10</p>
        <p class="email-muted-text" style="margin:4px 0 0 0; font-size:14px; color:#64748B;" th:if="${requestDevice != null}" th:text="#{email.auth.passwordReset.requestDevice(${requestDevice})}">Device</p>
    </th:block>
</th:block>
</body>
</html>
