<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{email/layouts/base :: emailLayout(${subjectLine}, 'Password reset requested', ~{::bodyContent})}">
    <th:block th:fragment="bodyContent">
        <h1 style="margin:0 0 12px 0; font-size:22px; color:#0F172A;">Reset your password</h1>
        <p style="margin:0 0 12px 0; font-size:15px; color:#334155;">Hello <span th:text="${userName}">User</span>,</p>
        <p style="margin:0 0 12px 0; font-size:15px; color:#334155;">We received a request to reset your password.</p>
        <th:block th:replace="~{email/components/button :: button(${resetUrl}, 'Reset Password', 'primary')}"></th:block>
        <th:block th:replace="~{email/components/plainLink :: plainLink(${resetUrl})}"></th:block>
        <th:block th:replace="~{email/components/alert :: alert('warn', 'If you did not request this, ignore this email or contact support.')}"></th:block>
        <p style="margin:10px 0 0 0; font-size:14px; color:#64748B;" th:text="${'This link expires in ' + expiresHours + ' hour(s).'}">This link expires in 1 hour.</p>
        <p style="margin:4px 0 0 0; font-size:14px; color:#64748B;">Request IP: <span th:text="${requestIp}">203.0.113.10</span></p>
        <p style="margin:4px 0 0 0; font-size:14px; color:#64748B;" th:if="${requestDevice != null}" th:text="${'Device: ' + requestDevice}">Device</p>
    </th:block>
</th:block>
</body>
</html>
