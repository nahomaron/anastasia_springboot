<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{email/layouts/base :: emailLayout(${subjectLine}, 'Confirm your email address', ~{::bodyContent})}">
    <th:block th:fragment="bodyContent">
        <h1 style="margin:0 0 12px 0; font-size:22px; color:#0F172A;">Confirm your email</h1>
        <p style="margin:0 0 14px 0; font-size:15px; color:#334155;">Hello <span th:text="${userName}">User</span>, please confirm your email to complete setup.</p>
        <th:block th:replace="~{email/components/button :: button(${verifyUrl}, 'Verify Email', 'primary')}"></th:block>
        <th:block th:replace="~{email/components/plainLink :: plainLink(${verifyUrl})}"></th:block>
        <th:block th:replace="~{email/components/alert :: alert('info', 'This link expires soon. If you did not request this, you can safely ignore this email.')}"></th:block>
        <p style="margin:10px 0 0 0; font-size:14px; color:#64748B;" th:text="${'Expires in ' + expiresHours + ' hours.'}">Expires in 24 hours.</p>
    </th:block>
</th:block>
</body>
</html>
