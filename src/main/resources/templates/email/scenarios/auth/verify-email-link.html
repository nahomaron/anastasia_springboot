<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{email/layouts/base :: emailLayout(${subjectLine}, #{email.auth.verifyEmailLink.preheader}, ~{::bodyContent})}">
    <th:block th:fragment="bodyContent">
        <h1 style="margin:0 0 12px 0; font-size:22px; color:#0F172A;" th:text="#{email.auth.verifyEmailLink.title}">Confirm your email</h1>
        <p style="margin:0 0 14px 0; font-size:15px; color:#334155;" th:text="#{email.auth.verifyEmailLink.greeting(${userName})}">Hello User, please confirm your email to complete setup.</p>
        <th:block th:replace="~{email/components/button :: button(${verifyUrl}, #{email.auth.verifyEmailLink.cta}, 'primary')}"></th:block>
        <th:block th:replace="~{email/components/plainLink :: plainLink(${verifyUrl})}"></th:block>
        <th:block th:replace="~{email/components/alert :: alert('info', #{email.auth.verifyEmailLink.alert})}"></th:block>
        <p class="email-muted-text" style="margin:10px 0 0 0; font-size:14px; color:#64748B;" th:text="#{email.auth.verifyEmailLink.expiry(${expiresMinutes})}">Expires in 10 minutes.</p>
    </th:block>
</th:block>
</body>
</html>
