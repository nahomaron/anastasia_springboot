<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{email/layouts/base :: emailLayout(${subjectLine}, 'Your appointment is confirmed', ~{::bodyContent})}">
    <th:block th:fragment="bodyContent">
        <h1 style="margin:0 0 12px 0; font-size:22px; color:#0F172A;">Appointment confirmed</h1>
        <p style="margin:0 0 12px 0; font-size:15px; color:#334155;">Hello <span th:text="${memberName}">Member</span>, your appointment is confirmed.</p>
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:10px 0;">
            <th:block th:replace="~{email/components/fieldRow :: fieldRow('Date & Time', ${dateTime})}"></th:block>
            <th:block th:replace="~{email/components/fieldRow :: fieldRow('Location / Link', ${locationOrMeetingLink})}"></th:block>
        </table>
        <th:block th:replace="~{email/components/button :: button(${rescheduleUrl}, 'Reschedule', 'secondary')}"></th:block>
        <th:block th:replace="~{email/components/plainLink :: plainLink(${rescheduleUrl})}"></th:block>
        <th:block th:replace="~{email/components/button :: button(${cancelUrl}, 'Cancel Appointment', 'secondary')}"></th:block>
        <th:block th:replace="~{email/components/plainLink :: plainLink(${cancelUrl})}"></th:block>
    </th:block>
</th:block>
</body>
</html>
