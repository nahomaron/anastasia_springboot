<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{email/layouts/base :: emailLayout(${subjectLine}, 'You are invited to an event', ~{::bodyContent})}">
    <th:block th:fragment="bodyContent">
        <h1 style="margin:0 0 12px 0; font-size:22px; color:#0F172A;">You're invited: <span th:text="${eventTitle}">Event</span></h1>
        <p style="margin:0 0 12px 0; font-size:15px; color:#334155;">Hello <span th:text="${memberName}">Member</span>, please join us for this event.</p>
        <th:block th:replace="~{email/components/eventDetails :: eventDetails(${date}, ${time}, ${location}, ${icsUrl})}"></th:block>
        <th:block th:replace="~{email/components/button :: button(${eventUrl}, 'View Event', 'primary')}"></th:block>
        <th:block th:replace="~{email/components/plainLink :: plainLink(${eventUrl})}"></th:block>
        <th:block th:replace="~{email/components/button :: button(${rsvpUrl}, 'RSVP', 'secondary')}"></th:block>
        <th:block th:replace="~{email/components/plainLink :: plainLink(${rsvpUrl})}"></th:block>
    </th:block>
</th:block>
</body>
</html>
