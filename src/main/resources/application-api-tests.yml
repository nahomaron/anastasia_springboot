base:
  url: http://localhost:8080

rate-limiter:
  enabled: false

spring:
  datasource:
    url: "jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  flyway:
    enabled: false
    locations: classpath:db/migration-h2,classpath:db/migration
    placeholders:
      members_columns_sql: ""
      children_columns_sql: ""
      tenant_demo_template_sql: "CALL ensure_tenant_demo_template_columns();"
      tenant_workspace_lifecycle_sql: "CALL ensure_tenant_workspace_columns();"
      normalize_priest_languages_sql: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  docker:
    compose:
      enabled: false
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000
  redis:
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 1
  kafka:
    listener:
      auto-startup: false
  mail:
    host: localhost
    port: 2525
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

auth:
  login:
    endpoint: /auth/login
  signup:
    endpoint: /auth/sign-up
  activate:
    endpoint: /auth/activate-account

test:
  activation:
    endpoint: /auth/test/activation-token
  cleanup:
    endpoint: /api/v1/test-utils/cleanup

app:
  auth:
    jwt-current-secret: YW5hc3Rhc2lhLXRlc3QtY3VycmVudC1qd3QtbWF0ZXJpYWwtMDE=
  onboarding:
    access-cookie:
      secure: false
      same-site: Lax
  public:
    backend-base-url: http://localhost:8080
    frontend-base-url: http://localhost:4200
  evn: api-tests
  seeding:
    enabled: false
  features:
    messaging:
      enabled: false
  membership-card:
    verify-base-url: http://localhost:8080
  kafka:
    enabled: false
  security:
    allow-anonymous: true
    oauth2-enabled: false
    public-docs-enabled: true
    test-helper-secret: ${TEST_HELPER_SECRET:}
  platform-admin:
    bootstrap-enabled: true
    secret: dev-secret

logging:
  pattern:
    console: "%clr(%5p) %clr(${PID}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40c){cyan} %clr(:){faint} %m%n"

email:
  sending:
    enabled: false

notification:
  email:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: always
  server:
    port: 8080

stripe:
  api-key: stripe_test_placeholder_key
  webhook-secret: stripe_test_placeholder_webhook
  success-url: "http://localhost:4200/payments/success?pid={PAYMENT_ID}"
  cancel-url: "http://localhost:4200/payments/cancel?pid={PAYMENT_ID}"

aws:
  s3:
    bucket: anastasia-app-bucket
    templates:
      enabled: false
  region: us-east-1

billing:
  tenant:
    currency: USD
    plans:
      BASIC:
        price-id: price_test_basic
        amount-minor: 1500
      ADVANCED:
        price-id: price_test_advanced
        amount-minor: 4900
      PREMIUM:
        price-id: price_test_premium
        amount-minor: 9900
