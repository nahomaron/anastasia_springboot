spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

email.sending.enabled=false
spring.docker.compose.enabled=false
# ===========================
# ACTUATOR HEALTH ENDPOINT
# ===========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.server.port=8080

spring.jpa.open-in-view=false



# ===========================
# REDIS CONFIGURATION
# ===========================
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=1

# ===========================
app.evn=test-server
app.features.messaging.enabled=false
aws.s3.bucket=anastasia-app-bucket
stripe.api-key=test_key
stripe.webhook-secret=stripe_test_placeholder_webhook
stripe.success-url=http://localhost:4200/payments/success?pid={PAYMENT_ID}
stripe.cancel-url=http://localhost:4200/payments/cancel?pid={PAYMENT_ID}
app.kafka.enabled=false
spring.kafka.listener.auto-startup=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
