server:
  address: 0.0.0.0
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:.env[.properties],optional:file:.env.production[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  main:
    lazy-initialization: true
  cache:
    type: simple
  kafka:
    listener:
      auto-startup: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - profile
              - email
  mail:
    host: ${MAIL_HOST:email-smtp.us-east-2.amazonaws.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: ${MAIL_PROTOCOL:smtp}
    from: ${MAIL_FROM:noreply@anastasisapp.com}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:${MAIL_SMTP_STARTTLS_ENABLE:true}}
            required: ${MAIL_STARTTLS_REQUIRED:true}
          timeout: ${MAIL_SMTP_TIMEOUT:3000}

management:
  health:
    redis:
      enabled: false
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

aws:
  accessKeyId: ${AWS_ACCESS_KEY_ID:}
  secretKey: ${AWS_SECRET_ACCESS_KEY:}
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    endpoint: ${AWS_S3_ENDPOINT:}
    prefix: ${AWS_S3_PREFIX:production}
    templates:
      enabled: false

stripe:
  secret-key: ${STRIPE_SECRET_KEY:${STRIPE_API_KEY:}}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  success-url: ${STRIPE_SUCCESS_URL:${APP_FRONTEND_BASE_URL}/payments/success?pid={PAYMENT_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:${APP_FRONTEND_BASE_URL}/payments/cancel?pid={PAYMENT_ID}}

billing:
  tenant:
    currency: ${BILLING_CURRENCY:USD}
    plans:
      BASIC:
        price-id: ${STRIPE_TENANT_BASIC_PRICE_ID:}
        amount-minor: ${STRIPE_TENANT_BASIC_AMOUNT_MINOR:1500}
      ADVANCED:
        price-id: ${STRIPE_TENANT_ADVANCED_PRICE_ID:}
        amount-minor: ${STRIPE_TENANT_ADVANCED_AMOUNT_MINOR:4900}
      PREMIUM:
        price-id: ${STRIPE_TENANT_PREMIUM_PRICE_ID:}
        amount-minor: ${STRIPE_TENANT_PREMIUM_AMOUNT_MINOR:9900}

twilio:
  account_sid: ${TWILIO_ACCOUNT_SID:}
  auth_token: ${TWILIO_AUTH_TOKEN:}
  phone_number: ${TWILIO_PHONE_NUMBER:}
  whatsapp_number: ${TWILIO_WHATSAPP_NUMBER:}

notification:
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
  sms:
    enabled: ${NOTIFICATION_SMS_ENABLED:false}
  whatsapp:
    enabled: ${NOTIFICATION_WHATSAPP_ENABLED:false}

app:
  env: prod
  public:
    frontend-base-url: ${APP_FRONTEND_BASE_URL:}
    backend-base-url: ${APP_BACKEND_BASE_URL:}
  auth:
    jwt-current-secret: ${ANASTASIA_JWT_CURRENT_SECRET:}
    jwt-previous-secret: ${ANASTASIA_JWT_PREVIOUS_SECRET:}
    refresh-cookie:
      secure: true
      same-site: ${APP_AUTH_REFRESH_COOKIE_SAME_SITE:None}
      domain: ${APP_AUTH_REFRESH_COOKIE_DOMAIN:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  seeding:
    enabled: false
  features:
    messaging:
      enabled: false
  kafka:
    enabled: false
    topic-prefix: ${APP_KAFKA_TOPIC_PREFIX:prod.}
    partitions: ${APP_KAFKA_PARTITIONS:3}
    replicas: ${APP_KAFKA_REPLICAS:1}
  security:
    allow-anonymous: false
    oauth2-enabled: ${APP_SECURITY_OAUTH2_ENABLED:true}
  platform-admin:
    secret: ${PLATFORM_ADMIN_SECRET:}

cache:
  warmup:
    enabled: false

outbox:
  relay:
    enabled: false
