flyway.placeholders.normalize_priest_languages_sql=INSERT INTO priest_languages(priest_id, language) \
SELECT priest_id, TRIM(lang) \
FROM ( \
SELECT id AS priest_id, jsonb_array_elements_text(languages::jsonb) AS lang \
FROM priests \
WHERE languages IS NOT NULL AND languages LIKE '[%' \
UNION ALL \
SELECT id AS priest_id, lang \
FROM priests, regexp_split_to_table(languages, '\\\\s*,\\\\s*') lang \
WHERE languages IS NOT NULL AND languages <> '' AND languages NOT LIKE '[%' \
) combined \
WHERE TRIM(lang) <> '' \
ON CONFLICT DO NOTHING;
