services:
  postgres:
    image: 'postgres:latest'
    container_name: "anastasia_postgres_container"
    environment:
      - 'POSTGRES_DB=anastasia_database'
      - 'POSTGRES_PASSWORD=password'
      - 'POSTGRES_USER=gebray'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anastasia-net

#  redis:
#    image: 'redis:latest'
#    ports:
#      - '6379:6379'

  backend:
    build: .
    container_name: "anastasia_backend"
    depends_on:
      - postgres
    environment:
      - SPRING_PROFILES_ACTIVE=test-server
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/anastasia_database
      - SPRING_DATASOURCE_USERNAME=gebray
      - SPRING_DATASOURCE_PASSWORD=password
    ports:
      - '8080:8080'
    networks:
      - anastasia-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  k6:
    image: grafana/k6:latest
    container_name: "anastasia_k6"
    depends_on:
       backend:
        condition: "service_healthy"
    environment:
      - TEST_BASE_URL=http://backend:8080/api
      - K6_CLOUD_TOKEN=${K6_INFLUXDB_TOKEN}
    volumes:
      - ./tests/load:/scripts
    command: >
      run --out cloud /scripts/smoke-test.js
    networks:
      - anastasia-net

volumes:
  postgres_data:

networks:
  anastasia-net:
    driver: bridge

