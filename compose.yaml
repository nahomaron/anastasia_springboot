services:
  postgres:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-anastasia_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anastasia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-anastasia_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-anastasia_dev}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - anastasia-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  k6:
    image: grafana/k6:latest
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TEST_BASE_URL: http://backend:8080/api/v1
      K6_CLOUD_TOKEN: ${K6_CLOUD_TOKEN:-}
    volumes:
      - ./performance/k6/scripts:/scripts
      - ./performance/k6/results:/results
    command: run --out json=/results/k6-output.json /scripts/auth-performance.js
    networks:
      - anastasia-net

  redis:
    image: redis:latest
    container_name: anastasia_redis
    ports:
      - "6379:6379"
    networks:
      - anastasia-net


volumes:
  postgres_data:

networks:
  anastasia-net:
    driver: bridge
