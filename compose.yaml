services:
    # ====================== POSTGRESQL ==========================================
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-anastasia_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anastasia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-anastasia_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ====================== KAFKA & SCHEMA REGISTRY ==========================================
  kafka:
    image: apache/kafka:3.8.0
    # CRITICAL: Map the broker port 9092 to your host machine
    ports:
      - "9092:9092"
      - "9094:9094"

    environment:
      # --- KRaft and Roles ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CLUSTER_ID: 4BSg2P35hM1m742z3C6t9G
      #You can generate a unique ID using `kafka-storage.sh random-uuid`

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093


      # 2. Advertised Listeners: The address Kafka tells external clients (your Java app) to use.
      # 'localhost:9092' is correct for a host client connecting to the mapped port.
      #      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-anastasia:9092,EXTERNAL://localhost:9094

      # --- KRaft Quorum and Protocol ---
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
#      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      #      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093 # Note: container uses its own localhost:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-anastasia:9093

      # --- Topic Defaults (From Docker Hub example) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    # Volume is optional for a quick test, but good for persistence
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  # Assuming this is in a separate section for the Schema Registry
#  schema-registry:
#    image: confluentinc/cp-schema-registry:7.6.1 # Use a compatible Confluent image
#    container_name: anastasia_backend-schema-registry-1 # Matches the name
#    ports:
#      - "8081:8081" # Map the default Schema Registry port
#    environment:
#      # CRITICAL: Tell the Schema Registry where the Kafka Broker is
#      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka-anastasia:9092' # Use the service name
#      SCHEMA_REGISTRY_HOST_NAME: schema-registry # Use the service name
#      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
#    depends_on:
#      - kafka

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    ports: [ "8081:8081" ]
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka-anastasia:9092"
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on: [ kafka ]

  backend:
    image: ${BACKEND_IMAGE:-anastasia-backend:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-anastasia_dev}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SERVER_PORT: 8080
    networks:
      - anastasia-net

# ====================== PERFORMANCE TESTING ==========================================
#  k6:
#    image: grafana/k6:latest
#    depends_on:
#      backend:
#        condition: service_healthy
#    env_file:
#      - .env
#    environment:
#      TEST_BASE_URL: http://backend:8080/api/v1
#      K6_CLOUD_TOKEN: ${K6_CLOUD_TOKEN:-}
#    volumes:
#      - ./performance/k6/scripts:/scripts
#      - ./performance/k6/results:/results
#    command: run --out json=/results/k6-output.json /scripts/auth-performance.js
#    networks:
#      - anastasia-net
#
# ====================== REDIS ==========================================
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - anastasia-net

  localstack:
    image: localstack/localstack
    ports:
      - "4566:4566"            # LocalStack Gateway
    environment:
      - SERVICES=s3                      # Start only S3 (or leave blank for all)
      - DEBUG=1
      - AWS_DEFAULT_REGION=us-east-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "./volume:/var/lib/localstack"
      - "./localstack/init:/etc/localstack/init/ready.d"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - anastasia-net

volumes:
  postgres_data:
  kafka_data:


networks:
  anastasia-net:
    driver: bridge
