services:
  postgres:
    profiles: ["local-db"]
    env_file:
      - .env.staging
    environment:
      POSTGRES_DB: ${DB_NAME:-anastasia_staging}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?Missing BACKEND_IMAGE}
    env_file:
      - .env.staging
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=60
        -XX:InitialRAMPercentage=25
        -XX:MaxMetaspaceSize=192m
        -XX:ReservedCodeCacheSize=64m
        -XX:+UseSerialGC
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-staging}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:?Missing DB_HOST}:${DB_PORT:-5432}/${DB_NAME:?Missing DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?Missing DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Missing DB_PASSWORD}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"
    restart: unless-stopped
    pull_policy: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 768m
    cpus: 1.00
