services:
  postgres:
    env_file:
      - .env.staging
    environment:
      POSTGRES_DB: ${DB_NAME:-anastasia_staging}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?Missing BACKEND_IMAGE}
    env_file:
      - .env.staging
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-staging}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-anastasia_staging}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"
    restart: unless-stopped
    pull_policy: always
    mem_limit: 768m
    cpus: 1.00
